  /api/receipts/{receiptId}/retry-post:
    post:
      operationId: retryPostReceipt
      tags: [receipts]
      summary: Gửi lại một phiếu đang ở post_failed
      description: |
        Đặt lại `outbox.attempts = 0`, `next_attempt_at = now`, `state = 'pending'`,
        `last_error = NULL`; `receipts.status = 'posting'`; ghi **đúng một** dòng `receipt_events`
        (`receipt.retry_requested`, `actor.kind = "operator"`). Nếu dòng outbox đã bị xoá (không
        nên xảy ra ở `post_failed`), **tạo lại** với `kind = 'post'`.

        **Trả `202 Accepted`, không phải `200`** — việc gửi SAP **chưa xảy ra** lúc trả lời; worker
        nhặt job ở tick kế tiếp (≤ `OUTBOX_TICK_MS`, mặc định 1000 ms). Trả `200` sẽ làm FE tưởng
        đã `posted`. FE **phải** poll `GET /api/receipts/{receiptId}` mỗi 2000 ms, tối đa 15 lần
        (30 s), dừng khi `status` rời khỏi `posting`.

        Body bị **bỏ qua hoàn toàn**, nhưng vẫn **bắt buộc** `content-type: application/json` (sai →
        `415`): endpoint đi qua `readJson()` đang có, viết một nhánh "POST không body" riêng là
        thêm một đường đi chưa ai test. FE gửi `{}`.

        Gọi hai lần liên tiếp thật nhanh: lần 2 thấy `status = "posting"` → `409
