openapi: 3.1.0

info:
  title: PDA Scan — Main Backend API
  version: 0.5.0
  summary: Hợp đồng HTTP của Main Backend cho ứng dụng nhập kho trên PDA.
  description: |
    Nguồn sự thật bằng văn bản, theo thứ tự thắng khi mâu thuẫn:
    `docs/specs/phase-3/01-contracts.md` (bất biến) → `docs/specs/phase-4/01-contracts-api.md` →
    `docs/specs/phase-5/02-contracts-api.md` → **file này** → các docs khác. File này là bản dịch
    sang OpenAPI để máy đọc được; khi lệch nhau, **spec thắng**.

    **Trạng thái triển khai — đọc trước khi tin bất cứ dòng nào**

    **29 trên 30 operation trong file này đã chạy thật.** Operation duy nhất chưa triển khai là
    `GET /api/events` (`x-status: planned`, SSE) — gọi thật trả `404 NOT_FOUND`; SSE đã hoãn sang
    **Phase 6** (QUYẾT ĐỊNH O-1), Phase 5 dùng polling.
    Mọi operation `x-status: phase-4` mô tả **code đang chạy**: `apps/server/src/` có
    `lifecycle.js`, `outbox.js`, `outboxWorker.js`, `sap/`, `master.js`, `rules/`, `routes/`;
    `db.js` có bảng `receipt_events` và `outbox`; `receipts` có đủ 8 cột vòng đời.

    Ba operation `x-status: phase-5` cũng mô tả **code đang chạy** — hình dạng response trong file
    này được chép lại từ response thật của một BE đang chạy, không phải từ spec: `src/events.js`
    (sổ `system_events`), `src/routes/admin.js` (hai endpoint đọc cho màn hình giám sát),
    `src/http.js` (`POST /api/devices/:deviceId/events`).

    Đo lúc **2026-09-22 04:59 +07**. **Mốc thời gian này sẽ cũ đi** — thay vì tin nó, hãy chạy bộ
    test hợp đồng, nó đối chiếu file này với bảng route thật và với response thật của BE theo cả
    hai chiều, và đồng thời kiểm cú pháp chính file này:

    ```bash
    cd apps/server && node --disable-warning=ExperimentalWarning --test test/contract.test.js
    ```

    **Quy ước chung**

    - Content-Type request JSON: `application/json` (sai → `415 UNSUPPORTED_MEDIA_TYPE`).
    - Content-Type response: `application/json; charset=utf-8`, kèm `cache-control: no-store`.
    - Thời gian: chuỗi ISO-8601 UTC có mili-giây và hậu tố `Z` (`new Date().toISOString()`).
    - Khoảng thời gian: số nguyên **mili-giây**, tên trường luôn kết thúc bằng `Ms`.
    - UUID: chữ thường, 36 ký tự, dạng v4.
    - Mọi lỗi dùng chung shape `Error`. Khoá `details` **vắng mặt** khi không có (không phải `null`).
    - BE **luôn** trả header `x-request-id`, kể cả trên response lỗi và response binary.

    **Nhãn `x-status` trên từng operation**

    | Giá trị | Nghĩa |
    |---|---|
    | `implemented` | Đã chạy thật trong `apps/server/src/http.js` từ Phase 1–2 (đã đọc code 2026-09-21) |
    | `phase-3` | Thuộc hợp đồng Phase 3, đã nghiệm thu ở Phase 3 |
    | `phase-4` | Thuộc **hợp đồng Phase 4**. Mô tả là *trạng thái đích theo hợp đồng*; xem khối "Trạng thái triển khai" ở trên trước khi gọi |
    | `phase-5` | Thuộc **hợp đồng Phase 5** (sổ sự kiện, màn hình giám sát). Đã chạy thật, đã đối chiếu với response thật |
    | `planned` | **Chưa triển khai, chưa có hợp đồng chi tiết.** Chỉ để nhìn thấy trước hình dạng. Ở bản 0.5.0 chỉ còn `GET /api/events` (SSE, hoãn sang Phase 6) |

    **Mã lỗi thêm ở Phase 4** (mọi mã của Phase 3 giữ nguyên 100%; nguồn:
    `docs/specs/phase-4/01-contracts-api.md` §10). Message tiếng Việt dưới đây là **nguyên văn**,
    test của BE và FE so khớp từng ký tự:

    | HTTP | code | message | Khi nào |
    |---|---|---|---|
    | 400 | `INVALID_QUERY` | `Tham số truy vấn không hợp lệ` | Query param sai kiểu/giá trị (`GET /api/receipts`, `GET /api/master/locations`) |
    | 400 | `INVALID_CURSOR` | `Con trỏ phân trang không hợp lệ` | `?cursor=` không giải mã được |
    | 409 | `RECEIPT_STATE_INVALID` | `Không thực hiện được thao tác này với trạng thái hiện tại của phiếu` | `retry-post` / `cancel` / `correct` gọi sai trạng thái |
    | 409 | `SAP_NOT_CONFIGURED` | `Chưa cấu hình kết nối SAP` | Gọi `retry-post` khi `SAP_ADAPTER=none` |
    | 409 | `DUPLICATE_LABEL` | `Nhãn này đã được nhập hôm nay` | Trùng nhãn cùng ngày + kho, chưa xác nhận |
    | 422 | `LOCATION_UNKNOWN` | `Vị trí không có trong danh mục kho` | `location` ngoài danh mục |

    Ba mã `SAP_*` nội bộ của adapter (`SAP_PART_UNKNOWN`, `SAP_UNAVAILABLE`, …) **không bao giờ**
    ra tới response HTTP của PDA; chúng chỉ nằm trong `receipt_events.detail.code`,
    `receipts.reject_code` và `outbox.last_error`.

    **Mã lỗi thêm ở Phase 5** (mọi mã cũ giữ nguyên 100 %):

    | HTTP | code | Khi nào |
    |---|---|---|
    | 400 | `INVALID_SINCE` | `GET /api/admin/events?since=` không phải số nguyên ≥ 0. `details = {since}` |
    | 400 | `INVALID_EVENT_TYPE` | `POST /api/devices/:deviceId/events` có phần tử `type` ngoài danh sách trắng 5 giá trị. `details = {type, allowed}` |

    **Biến môi trường thêm ở Phase 5** (nguồn: `apps/server/.env.example`):

    | Biến | Mặc định | Tác dụng |
    |---|---|---|
    | `RECOGNITION_MODE` | `sync` | `async` → `POST /api/recognitions` trả `202` + `pollUrl` thay vì `201` |
    | `RECOGNITION_POLL_HINT_MS` | `1000` | Vào `pollAfterMs` của body `202` và header `retry-after` |
    | `EVENTS_ENABLED` | `true` | `false` → `events.write()` thành no-op, `GET /api/admin/events` trả `items: []` |
    | `EVENTS_MAX_ROWS` | `2000` | Số dòng `system_events` giữ lại; vượt thì cắt dòng cũ nhất |
    | `EVENTS_TRIM_EVERY` | `100` | Cứ mỗi N **dòng** ghi thì chạy cắt một lần |
    | `EVENTS_MIRROR_RECEIPTS` | `true` | `false` → không ghi gương `receipt_events` sang `system_events` |
  contact:
    name: Tài liệu dự án
    url: https://pda-scan.local/docs/index.md
  license:
    name: Nội bộ — không phát hành

servers:
  - url: http://127.0.0.1:3000
    description: |
      Main Backend chạy trực tiếp. `apps/server/.env` hiện đặt `HOST=0.0.0.0`, nên thực tế
      cũng nghe trên địa chỉ LAN.
  - url: https://{lanIp}:5173
    description: |
      Vite dev server (HTTPS, chứng chỉ tự ký) proxy mọi đường dẫn `/api` sang Main Backend.
      Đây là địa chỉ **duy nhất** mà PDA cần biết; camera yêu cầu secure context nên phải là HTTPS.
    variables:
      lanIp:
        default: 192.168.1.10
        description: Địa chỉ IPv4 LAN của máy chạy dev server.

tags:
  - name: health
    description: Kiểm tra sống chết ở mức thô.
  - name: recognition
    description: Nhận dạng nhãn từ ảnh.
  - name: receipts
    description: Phiếu nhập kho đã được người vận hành xác nhận.
  - name: devices
    description: Thiết bị (một cài đặt webapp trên một trình duyệt).
  - name: sessions
    description: Phiên làm việc (ca) của một thiết bị.
  - name: status
    description: Kênh trạng thái ngược cho PDA.
  - name: master
    description: Danh mục dữ liệu chủ (vị trí kho, kho, ca). Chỉ đọc, nạp một lần lúc khởi động.
  - name: admin
    description: Quản trị kịch bản mô phỏng và hai endpoint đọc của màn hình giám sát S9. Không có auth ở Phase 3–5.

paths:

  # ─────────────────────────────── ĐÃ TRIỂN KHAI (Phase 1–2) ───────────────────────────────

  /api/health:
    get:
      operationId: getHealth
      tags: [health]
      summary: Kiểm tra máy chủ còn sống và DB mở được
      description: |
        Shape 8 field này **không đổi** ở Phase 3 (`api.test.js` đang khoá nó). Mọi thông tin mới
        nằm ở `GET /api/status`.

        Lưu ý: `mockMode` là `null` khi `RECOGNITION_PROVIDER=http` — chỉ có giá trị khi provider là
        `mock`. Endpoint này **bị chặn** khi `sim.backend.mode = "down"` (có chủ ý: nó mô phỏng máy
        chủ chết thật); chỉ `/api/status` và `/api/admin/*` được miễn trừ.
      x-status: implemented
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Máy chủ sống
          headers:
            x-request-id:
              $ref: '#/components/headers/XRequestIdOut'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
              example:
                ok: true
                uptimeSec: 12
                provider: http
                mockMode: null
                simOverride: true
                simSaveFail: false
                db: ok
                receipts: 3
        '503':
          $ref: '#/components/responses/Err503'

  /api/recognitions:
    post:
      operationId: createRecognition
      tags: [recognition]
      summary: Tải ảnh nhãn lên và nhận dạng (đồng bộ hoặc bất đồng bộ tuỳ RECOGNITION_MODE)
      description: |
        `multipart/form-data`, bắt buộc field `image` (file). Loại ảnh xác định bằng **magic bytes**
        (JPEG/PNG/WebP), không tin `content-type` của client. Tên file trên đĩa do server tạo.

        **Hai nhánh, chọn bằng biến môi trường `RECOGNITION_MODE`** (mặc định `sync`; client biết
        mình đang ở nhánh nào bằng `recognition.mode` của `GET /api/status`, **không** hard-code):

        | `RECOGNITION_MODE` | HTTP | Body | Header thêm |
        |---|---|---|---|
        | `sync` (mặc định) | `201` | kết quả đầy đủ, `status` là `completed` hoặc `failed` | — |
        | `async` (Phase 5) | `202` | **cùng shape**, `status: "pending"`, `fields: null`, cộng `pollUrl` + `pollAfterMs` | `location`, `retry-after` |

        Nhánh `sync`: BE gọi provider trong ngân sách `RECOGNITION_TIMEOUT_MS` (mặc định `20000` ms,
        dùng chung cho cả 2 attempt) rồi mới trả kết quả.

        Nhánh `async`: BE nhận ảnh, tạo dòng `recognitions` ở `pending`, trả `202` ngay, rồi chạy
        nền. PDA poll `GET /api/recognitions/{recognitionId}` cho tới khi `status` khác `pending`.
        Công việc **không** phụ thuộc kết nối của PDA: đóng tab hay reload giữa chừng, việc vẫn
        chạy và kết quả vẫn đọc lại được.

        Phase 3 bổ sung `fieldsFound` và `requestId` vào body response (tương thích ngược — chỉ thêm).
      x-status: implemented
      parameters:
        - $ref: '#/components/parameters/XDeviceId'
        - $ref: '#/components/parameters/XSessionId'
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XAppVersion'
        - name: sim
          in: query
          required: false
          description: |
            Kịch bản OCR chỉ áp cho **đúng request này**. Chỉ có tác dụng khi `SIM_OVERRIDE=true`;
            khi `false` bị bỏ qua hoàn toàn, không báo lỗi. Sai giá trị → `400 INVALID_SIM`
            (giữ mã cũ, **không phải** `INVALID_SIM_CONFIG`).
          schema: { $ref: '#/components/schemas/OcrMode' }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
                  description: Ảnh nhãn, tối đa `MAX_UPLOAD_BYTES` (mặc định 10485760 byte).
      responses:
        '201':
          description: '`RECOGNITION_MODE=sync` — nhận dạng xong (kể cả khi không đọc được trường nào)'
          headers:
            x-request-id:
              $ref: '#/components/headers/XRequestIdOut'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecognitionResult' }
        '202':
          description: |
            `RECOGNITION_MODE=async` — đã nhận ảnh, việc nhận dạng chạy nền. Body **đúng shape**
            của `GET /api/recognitions/{recognitionId}` cộng thêm `pollUrl` và `pollAfterMs`.
          headers:
            x-request-id:
              $ref: '#/components/headers/XRequestIdOut'
            location:
              description: '`/api/recognitions/{recognitionId}` — bằng đúng `pollUrl` trong body.'
              schema: { type: string }
            retry-after:
              description: Số **giây** nên chờ trước lần poll đầu tiên, làm tròn lên từ `pollAfterMs`.
              schema: { type: integer, minimum: 1 }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecognitionResult' }
              example:
                recognitionId: a1ce19e7-7eed-47b6-b361-ccd058df5ab0
                status: pending
                provider: mock
                fieldsFound: 0
                fields: null
                warnings: []
                error: null
                image: { id: 444bbcfa-51bb-4634-93cf-ea9a9f90c90f, url: /api/images/444bbcfa-51bb-4634-93cf-ea9a9f90c90f, mimeType: image/jpeg, bytes: 2368698 }
                durationMs: null
                requestId: b4694a6b-1eb3-42f1-8c45-ed614c074763
                createdAt: '2026-09-21T20:49:22.384Z'
                finishedAt: null
                pollUrl: /api/recognitions/a1ce19e7-7eed-47b6-b361-ccd058df5ab0
                pollAfterMs: 1000
        '400':
          $ref: '#/components/responses/Err400'
        '413':
          $ref: '#/components/responses/Err413'
        '415':
          $ref: '#/components/responses/Err415'
        '429':
          $ref: '#/components/responses/Err429'
        '502':
          $ref: '#/components/responses/Err502'
        '503':
          $ref: '#/components/responses/Err503'
        '504':
          $ref: '#/components/responses/Err504'

  /api/recognitions/{recognitionId}:
    get:
      operationId: getRecognition
      tags: [recognition]
      summary: Đọc lại một kết quả nhận dạng
      description: |
        Cùng shape với `201` của `POST /api/recognitions`, **trừ** `pollUrl`/`pollAfterMs` (hai key
        đó chỉ có trên body `202`). `status` là `pending | completed | failed`.

        Ở Phase 1–4 luồng là đồng bộ nên `pending` không tồn tại lâu. **Từ Phase 5**, khi
        `RECOGNITION_MODE=async`, đây là endpoint **polling chính** của PDA.

        **`status: "failed"` vẫn là HTTP `200`.** "Nhận dạng thất bại" là một *kết quả đã biết*,
        không phải lỗi giao thức: chi tiết nằm ở `error.code` / `error.message`. Chỉ khi
        `recognitionId` không tồn tại mới là `404 NOT_FOUND`.
      x-status: implemented
      parameters:
        - $ref: '#/components/parameters/RecognitionIdPath'
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Kết quả nhận dạng
          headers:
            x-request-id:
              $ref: '#/components/headers/XRequestIdOut'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecognitionResult' }
        '404':
          $ref: '#/components/responses/Err404'

  /api/images/{imageId}:
    get:
      operationId: getImage
      tags: [recognition]
      summary: Tải ảnh nhãn đã lưu (binary)
      description: |
        Trả đúng `content-type` đã sniff được (`image/jpeg`, `image/png`, `image/webp`), kèm
        `cache-control: private, max-age=3600` và `x-content-type-options: nosniff`.

        Response này **cũng phải mang `x-request-id`** — handler dùng `res.writeHead(200, {...})`
        nên phải đặt header trước đó hoặc thêm thẳng vào object của `writeHead`. Không có ngoại lệ.
      x-status: implemented
      parameters:
        - $ref: '#/components/parameters/ImageIdPath'
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Nội dung ảnh
          headers:
            x-request-id:
              $ref: '#/components/headers/XRequestIdOut'
            cache-control:
              schema: { type: string }
              example: private, max-age=3600
            x-content-type-options:
              schema: { type: string }
              example: nosniff
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
        '404':
          $ref: '#/components/responses/Err404'

  /api/receipts:
    post:
      operationId: createReceipt
      tags: [receipts]
      summary: Lưu phiếu nhập kho đã xác nhận (idempotent theo requestId)
      description: |
        Thứ tự xử lý: validate hình thức → validate `data` (422) → kiểm `recognitionId` tồn tại
        (422) → tính `payloadHash = sha256(canonicalJson({recognitionId, source, data đã ép kiểu}))`
        → `INSERT` với `UNIQUE(request_id)`.

        **Idempotency:** cùng `requestId` + cùng `payloadHash` → `200` với `idempotent: true`,
        không tạo dòng mới. Cùng `requestId` + payload **khác** → `409 REQUEST_ID_CONFLICT`.

        Kiểm tra idempotency chạy **trước** mô phỏng `save.mode=fail`, nên một `requestId` đã lưu
        vẫn trả được bản cũ ngay cả khi đang bật mô phỏng lỗi lưu.

        Phase 3 bổ sung `deviceId` và `sessionId` (lấy từ **header**, không lấy từ body) vào response.

        **Phase 4 mở rộng** (hợp đồng `01-contracts-api.md` §9 — phần mở rộng chưa có trong
        `http.js` lúc viết, xem khối "Trạng thái triển khai" ở `info.description`):

        - Thêm field body `allowDuplicate` (boolean, mặc định `false`). Nó **không** tham gia
          `payloadHash`, nên gửi lại cùng `requestId` kèm `allowDuplicate: true` sau khi bị 409
          **không** bị coi là "payload khác" — đó chính là cơ chế của luồng xác nhận 2 bước.
        - Thứ tự xử lý **bắt buộc**: hình thức → `validateReceiptData` → `recognitionId` tồn tại →
          `payloadHash` → **idempotency (tra `requestId`)** → rule vị trí → rule trùng nhãn →
          `save.mode` → transaction ghi. Idempotency phải đứng **trước** mọi rule, nếu không một
          lần retry của `transport.js` (cùng `requestId`) sẽ tự phát hiện chính mình là trùng nhãn.
        - Hai mã lỗi mới: `409 DUPLICATE_LABEL` (§9.3) và `422 LOCATION_UNKNOWN` (§9.4).
        - Response thêm 7 field của phiếu (xem `schemas.Receipt`). Phiếu vừa lưu **luôn** ở
          `status: "confirmed"` — worker chưa chạy tại thời điểm trả lời.

        **Khoá trùng nhãn** gồm 5 thành phần: `partNumber` + `batch` + `saNumber` +
        `warehouse` (từ `sessions.warehouse` của `x-session-id`) + `day`. `batch`/`saNumber`/
        `warehouse` là `null` thì so sánh như chuỗi rỗng. `day` là **ngày ĐỊA PHƯƠNG** suy từ
        `receipts.created_at` cộng `TZ_OFFSET_MINUTES` (mặc định **420** = UTC+7), **không phải**
        ngày UTC: kho vận hành ở Việt Nam, mốc 00:00 UTC rơi vào 07:00 giờ VN tức giữa ca sáng.
        Mọi mốc thời gian **lưu trữ** vẫn là UTC; chỉ riêng khoá nghiệp vụ "cùng ngày" dùng ngày
        địa phương.
      x-status: implemented
      parameters:
        - $ref: '#/components/parameters/XDeviceId'
        - $ref: '#/components/parameters/XSessionId'
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XAppVersion'
        - name: simSave
          in: query
          required: false
