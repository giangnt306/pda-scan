    get:
      operationId: listReceipts
      tags: [receipts]
      summary: Danh sách phiếu mới nhất (lọc + phân trang keyset)
      description: |
        Sắp xếp **cố định** `ORDER BY created_at DESC, rowid DESC`. Không có tham số đổi thứ tự.

        **Phase 4 mở rộng** (hợp đồng `01-contracts-api.md` §2 — chưa có trong `http.js` lúc viết):
        4 tham số lọc, phân trang **keyset** và ba key mới trong response (`nextCursor`, `counts`,
        `serverTime`). Gọi kiểu Phase 1 (`?limit=3`) vẫn trả `items` đúng như cũ — chỉ thêm key,
        không đổi/xoá.

        **Phân trang keyset, không phải offset.** `cursor = base64url("<createdAt>|<rowid>")`.
        Server đọc `limit + 1` dòng; đọc đủ `limit + 1` → cắt còn `limit` và `nextCursor` là cursor
        của **dòng cuối cùng được trả về**, ngược lại `nextCursor = null`. Offset (`?page=`) cho kết
        quả sai khi có phiếu mới chèn vào giữa lúc người dùng đang cuộn — đúng cảnh thường gặp ở kho.

        **`counts` bỏ qua `status`, `limit`, `cursor`** và chỉ chịu `sessionId` + `deviceId`. Nhờ
        vậy số trên các chip lọc của màn hình S6 ("Chờ SAP 2", "Lỗi 1") không về 0 ngay khi người
        dùng bấm một chip.
      x-status: implemented
      parameters:
        - name: sessionId
          in: query
          required: false
          description: 'Lọc theo phiên. Sai định dạng → `400 INVALID_QUERY`, `details.field = "sessionId"`. **Phase 4.**'
          schema:
            type: string
            pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
        - name: deviceId
          in: query
          required: false
          description: 'Lọc theo thiết bị. Sai định dạng → `400 INVALID_QUERY`, `details.field = "deviceId"`. **Phase 4.**'
          schema:
            type: string
            pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
        - name: status
          in: query
          required: false
          description: |
            Một hoặc nhiều giá trị `ReceiptStatus` **ngăn cách bằng dấu phẩy**, tối đa 8 giá trị.
            BE `trim()` từng phần tử trước khi kiểm enum. `?status=` (rỗng) coi như **không lọc**,
            không báo lỗi. Giá trị ngoài enum → `400 INVALID_QUERY` với
            `details = {field: "status", allowed: [8 giá trị]}`. **Phase 4.**
          schema: { type: string, example: 'posting,post_failed' }
        - name: limit
          in: query
          required: false
          description: |
            Số bản ghi tối đa. Mặc định 20, trần 200. Giá trị **không parse được** (`?limit=abc`) →
            dùng mặc định 20, **không** báo lỗi (giữ nguyên hành vi Phase 1, đã bị `api.test.js`
            khoá). Parse được nhưng ngoài khoảng → **kẹp** về `[1, 200]`.
          schema: { type: integer, minimum: 1, maximum: 200, default: 20 }
        - name: cursor
          in: query
          required: false
          description: |
            Chuỗi base64url **do chính BE sinh** (`nextCursor` của trang trước). Hỏng → `400
            INVALID_CURSOR` với `details.cursor` là 64 ký tự đầu. Khác với `limit`: cursor hỏng
            nghĩa là client đang phân trang sai, im lặng trả trang 1 sẽ làm FE lặp vô hạn. **Phase 4.**
          schema: { type: string, example: MjAyNi0wOS0yMVQxNDoxMDowMC4zMjFafDQy }
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Danh sách, mới nhất trước
          headers:
            x-request-id:
              $ref: '#/components/headers/XRequestIdOut'
          content:
            application/json:
              schema:
                type: object
                required: [items]
                description: |
                  `items` là key duy nhất **bắt buộc** — ba key còn lại là phần thêm của Phase 4,
                  giữ `required` ở mức Phase 1 để client cũ không vỡ hợp đồng.
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Receipt' }
                  nextCursor:
                    type: [string, 'null']
                    description: 'Cursor của trang kế; `null` khi đã hết. **Phase 4.**'
                  counts: { $ref: '#/components/schemas/ReceiptCounts' }
                  serverTime: { type: string, format: date-time }
              example:
                items: []
                nextCursor: MjAyNi0wOS0yMVQxNDoxMDowMC4zMjFafDQy
                counts:
                  total: 12
                  byStatus:
                    confirmed: 0
                    posting: 2
                    posted: 8
                    post_failed: 1
                    rejected: 1
                    cancelled: 0
                    corrected: 0
                    superseded: 0
                serverTime: '2026-09-21T14:12:00.000Z'
        '400':
          $ref: '#/components/responses/Err400'

