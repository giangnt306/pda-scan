      summary: PDA báo lô sự kiện quan sát lên máy chủ (1–20 sự kiện mỗi lô)
      description: |
        Nguồn của các dòng `device.*` trên màn hình giám sát S9. Đây là endpoint **ghi** mới duy
        nhất của Phase 5 nằm ngoài `/api/admin/`, nên nó **chịu** sim middleware như mọi endpoint
        ghi khác: `backend.mode = "readonly"` chặn nó bằng `503 BACKEND_READONLY`. Khi bị chặn,
        FE **bỏ luôn** lô sự kiện đó — không xếp hàng, không retry (mất vài dòng nhật ký quan sát
        không đáng để làm nhiễu hàng chờ phiếu).

        **Cả lô hoặc không gì cả.** Toàn bộ `events[]` được kiểm **trước** khi ghi; một phần tử
        sai `type` → `400 INVALID_EVENT_TYPE` và **không dòng nào** được ghi. Ghi một phần rồi
        báo lỗi sẽ khiến FE không biết phải gửi lại từ đâu.

        `events[].at` là giờ **của client**: nó đi vào cột `system_events.client_at` và chỉ để
