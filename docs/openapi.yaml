  /api/admin/events:
    get:
      operationId: listSystemEvents
      tags: [admin]
      summary: Đọc sổ sự kiện toàn hệ thống theo con trỏ tăng dần
      description: |
        Nguồn dữ liệu của khối «Dòng sự kiện» trên màn hình giám sát S9. Nằm dưới `/api/admin/`
        nên được sim middleware **miễn trừ hoàn toàn**: monitor phải sống được đúng lúc
        `backend.mode = "down"` — nếu không thì nó vô dụng ở đúng tình huống cần nó nhất.

        **`items` luôn theo `id` TĂNG DẦN** (cũ trước, mới sau). Đây là một *luồng*: client giữ
        `lastId` rồi nối thêm vào cuối danh sách đang có. Hai nhánh, hai câu SQL, cùng một thứ tự
        đầu ra:

        ```sql
        -- since = 0  →  "cho tôi limit dòng MỚI NHẤT", rồi đảo lại cho tăng dần
        SELECT * FROM (SELECT * FROM system_events ORDER BY id DESC LIMIT :limit) ORDER BY id ASC;
        -- since > 0  →  nối tiếp từ con trỏ
        SELECT * FROM system_events WHERE id > :since ORDER BY id ASC LIMIT :limit;
        ```

        `items` rỗng → `lastId` **bằng đúng `since` mà client gửi**, không phải `0`. Trả `0` sẽ
        làm monitor tải lại cả dòng sự kiện sau mỗi nhịp poll.

        **MẤT DÒNG do vòng xoay — `oldestId`.** `system_events` là bảng VÒNG XOAY: vượt
        `EVENTS_MAX_ROWS` thì dòng cũ bị `DELETE`. Một client tụt lại quá xa sẽ thấy con trỏ
        `since` của mình đã bị cắt qua, và những dòng ở giữa **mất vĩnh viễn**. `oldestId` là
        `MIN(id)` của cả bảng, có mặt trong **mọi** response để client tự phát hiện:

        ```
        # chỉ áp dụng khi since > 0 (since = 0 là "cho tôi limit dòng mới nhất", không phải con trỏ)
        biên  = items rỗng ? oldestId : min(oldestId, id nhỏ nhất trong items)
        mất   = max(0, biên - since - 1)
        ```

        `id` là `INTEGER PRIMARY KEY AUTOINCREMENT` và bảng chỉ INSERT, nên dãy `id` liền mạch
        và `mất` là **số dòng thật sự đã bị cắt**, không phải ước lượng. `oldestId = 0` ⇒ không
        kết luận gì. Webapp hiện con số này thành một dòng cảnh báo trên khối «Dòng sự kiện»
        (`apps/webapp/src/lib/monitorFeed.js` → `countLostEvents`, `feedGapText`).

        **Nết khoan dung:** `limit` ngoài khoảng → kẹp về biên; `type`, `severity`, `deviceId`
        sai → **bỏ bộ lọc đó**, không báo lỗi. Chỉ `since` sai mới là `400 INVALID_SINCE`, vì
        `since` hỏng nghĩa là client đang phân trang sai và sẽ lặng lẽ bỏ sót sự kiện.

        `EVENTS_ENABLED=false` → `items: []`, `lastId` = `since`, `hasMore: false`, `oldestId: 0`.
      x-status: phase-5
      parameters:
        - name: since
          in: query
          required: false
          description: 'Chỉ trả các dòng có `id > since`. Mặc định `0` nghĩa là "cho tôi `limit` dòng mới nhất". Không phải số nguyên ≥ 0 → `400 INVALID_SINCE`.'
          schema: { type: integer, minimum: 0, default: 0 }
        - name: limit
          in: query
          required: false
          description: Ngoài khoảng thì kẹp về biên, không báo lỗi.
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: type
          in: query
          required: false
          description: |
            Lọc **khớp chính xác**. Nhiều loại thì lặp `&type=`, ngăn bằng dấu phẩy, hoặc trộn cả
            hai: `?type=recognition.failed,receipt.posted&type=sim.updated`. Loại không có thật
            chỉ làm kết quả rỗng, không báo lỗi.
          schema: { type: string }
        - name: severity
          in: query
          required: false
          description: Giá trị lạ → bỏ bộ lọc.
          schema: { $ref: '#/components/schemas/EventSeverity' }
        - name: deviceId
          in: query
          required: false
          description: Không phải UUID v4 → bỏ bộ lọc.
          schema: { type: string }
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Một trang của sổ sự kiện, sắp xếp `id` tăng dần
          headers:
            x-request-id:
              $ref: '#/components/headers/XRequestIdOut'
          content:
            application/json:
              schema:
                type: object
                required: [items, lastId, hasMore, oldestId, serverTime]
                additionalProperties: false
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/SystemEvent' }
                  lastId:
                    type: integer
                    minimum: 0
                    description: '`id` lớn nhất trong `items`; `items` rỗng → bằng `since` client gửi.'
                  hasMore:
                    type: boolean
                    description: Còn dòng thoả điều kiện sau `lastId` — client nên poll lại ngay thay vì chờ hết nhịp.
                  oldestId:
                    type: integer
                    minimum: 0
                    description: |
                      `MIN(id)` của **cả bảng** `system_events` — dòng cũ nhất vòng xoay còn giữ.
                      **Không** chịu ảnh hưởng của `type` / `severity` / `deviceId`: vòng xoay cắt
                      theo bảng chứ không theo bộ lọc.

                      `0` nghĩa là **bảng rỗng hoặc máy chủ không đọc được** — client KHÔNG được
                      kết luận đã mất dòng trong trường hợp này.
                  serverTime: { type: string, format: date-time }
              example:
                items:
                  - id: 3
                    at: '2026-09-21T20:48:45.681Z'
                    type: device.camera_error
                    severity: warn
                    deviceId: 996fd7be-d02b-411f-bc93-f11f68af9a0b
                    sessionId: null
                    receiptId: null
                    recognitionId: null
                    clientAt: '2026-09-22T03:14:05.100Z'
                    detail: { name: NotAllowedError }
                  - id: 4
                    at: '2026-09-21T20:48:45.681Z'
                    type: device.queue_enqueued
                    severity: warn
                    deviceId: 996fd7be-d02b-411f-bc93-f11f68af9a0b
                    sessionId: null
                    receiptId: null
                    recognitionId: null
                    clientAt: null
                    detail: { reason: OFFLINE, size: 3 }
                lastId: 4
                hasMore: false
                oldestId: 1
                serverTime: '2026-09-21T20:48:50.994Z'
        '400':
          $ref: '#/components/responses/Err400'

  /api/admin/recognitions:
    get:
      operationId: listAdminRecognitions
      tags: [admin]
      summary: Hàng đợi nhận dạng cho màn hình giám sát
      description: |
        Nguồn dữ liệu của khối «Hàng đợi nhận dạng» trên S9. Cũng được sim middleware miễn trừ
        như mọi route `/api/admin/*`.

        Trả **mới-nhất-trước** — đây là một *danh sách* người đọc, không phải luồng như
        `GET /api/admin/events`.

        `counts` đếm **toàn bộ bảng** `recognitions`, không chỉ trang hiện tại, nên nó **không**
        thay đổi theo `limit` hay `status`.

        Endpoint này cố ý **không** trả `fields` / `rawText`: người giám sát không cần dữ liệu
        nhãn, và đó là dữ liệu nghiệp vụ.

        Mọi tham số đều khoan dung: `status` lạ → bỏ bộ lọc; `limit` ngoài khoảng → kẹp về biên.
        Không có nhánh lỗi `400` nào.
      x-status: phase-5
      parameters:
        - name: status
          in: query
          required: false
          description: Không lọc nếu vắng mặt hoặc giá trị ngoài 3 giá trị hợp lệ.
          schema: { type: string, enum: [pending, completed, failed] }
        - name: limit
          in: query
          required: false
          description: Ngoài khoảng thì kẹp về biên.
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Trang mới-nhất-trước kèm bộ đếm toàn bảng
          headers:
            x-request-id:
              $ref: '#/components/headers/XRequestIdOut'
          content:
            application/json:
              schema:
                type: object
                required: [items, counts, serverTime]
                additionalProperties: false
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AdminRecognition' }
                  counts:
                    type: object
                    required: [pending, completed, failed]
                    additionalProperties: false
                    description: Đếm toàn bảng `recognitions`, độc lập với `status` và `limit`.
                    properties:
                      pending: { type: integer, minimum: 0 }
                      completed: { type: integer, minimum: 0 }
                      failed: { type: integer, minimum: 0 }
                  serverTime:
                    type: string
                    format: date-time
                    description: Lấy **một lần** và dùng chung cho cả `ageMs`, để `ageMs` đúng bằng `serverTime - createdAt`.
              example:
                items:
                  - recognitionId: 73c1bef9-e6dd-4348-af4c-fe78f04fddd0
                    status: pending
                    provider: mock
                    deviceId: 996fd7be-d02b-411f-bc93-f11f68af9a0b
                    sessionId: null
                    imageId: b5d30685-f798-4e97-8fc4-defc1ec2f6c9
                    createdAt: '2026-09-21T20:49:11.864Z'
                    finishedAt: null
                    durationMs: null
                    ageMs: 13
                    fieldsFound: 0
                    errorCode: null
                counts: { pending: 1, completed: 0, failed: 0 }
                serverTime: '2026-09-21T20:49:11.877Z'

  # ─────────────────────────────── CHƯA TRIỂN KHAI ───────────────────────────────

  /api/events:
    get:
      operationId: streamEvents
      tags: [status]
      summary: Dòng sự kiện realtime cho màn hình giám sát (SSE)
      description: |
        **CHƯA TRIỂN KHAI** — đã **hoãn sang Phase 6** (QUYẾT ĐỊNH O-1 của
        `docs/specs/phase-5/00-overview.md`). Phase 5 dùng **polling**, không dùng SSE: màn hình
        giám sát S9 đọc `GET /api/admin/events?since=` theo con trỏ tăng dần. Vì con trỏ đã tăng
        dần đơn điệu, nâng lên SSE sau này **không** phải đổi shape dữ liệu.

        `text/event-stream`. Mỗi sự kiện là một dòng `data:` chứa JSON. PDA sẽ vẫn dùng poll
        `GET /api/status` (đơn giản hơn, chịu được mạng kho chập chờn).
      x-status: planned
      x-phase: 6
      parameters:
        - name: since
          in: query
          required: false
          description: Chỉ gửi sự kiện sau mốc thời gian này.
          schema: { type: string, format: date-time }
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Luồng sự kiện
          content:
            text/event-stream:
              schema: { type: string }
              example: |
                event: device.status
                data: {"deviceId":"0d5c7f33-9d59-4d2e-8f11-0b3c9c0bd511","status":"stale","at":"2026-09-21T14:06:05.000Z"}

                event: receipt.posted
                data: {"receiptId":"c2e51dbb-1b93-4f2e-8d2a-5a1a3f4e9c77","sapDocumentNo":"5000123456","at":"2026-09-21T14:10:21.004Z"}

components:

  parameters:

    XDeviceId:
      name: x-device-id
      in: header
      required: false
      description: |
        Định danh cài đặt webapp trên thiết bị. FE sinh **một lần** bằng `crypto.randomUUID()` và lưu
        `localStorage["pdaScan.deviceId"]`. Bắt buộc theo cờ `REQUIRE_DEVICE_ID` (mặc định `false` ở
        Phase 3). BE **không** tự lowercase: chữ hoa → `400 INVALID_DEVICE_ID`.
      schema:
        type: string
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
        example: 0d5c7f33-9d59-4d2e-8f11-0b3c9c0bd511

    XSessionId:
      name: x-session-id
      in: header
      required: false
      description: |
        Phiên làm việc hiện tại (tuỳ chọn ở Phase 3). Gửi id của phiên **đã kết thúc** không bị báo
        lỗi; BE chỉ ghi `session_id` như cũ. FE nên tự xoá phiên quá 12 giờ.
      schema:
        type: string
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
        example: 6a1f0f0d-3cc4-4b26-9a2e-1e8be2b1c7a4

    XRequestId:
      name: x-request-id
      in: header
      required: false
      description: |
        Khoá **truy vết** một lần gọi mạng, xuyên FE → BE → ai-server. FE sinh **mới ở mỗi attempt**,
        kể cả khi retry cùng một `requestId` nghiệp vụ. Thiếu hoặc sai định dạng → BE tự sinh và
        **không báo lỗi**. BE luôn trả lại header này.
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{8,128}$'
        example: 9f2a41c6-2e6b-4a13-b0a9-2f45a1f8b7c3

    XAppVersion:
      name: x-app-version
      in: header
      required: false
      description: Version webapp, để BE ghi log. Tuỳ chọn.
      schema: { type: string, maxLength: 32, example: 0.2.0 }

    DeviceIdPath:
      name: deviceId
      in: path
      required: true
      description: Phải trùng `x-device-id` nếu header có mặt; khác → `400 DEVICE_ID_MISMATCH`.
      schema:
        type: string
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'

    SessionIdPath:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'

    RecognitionIdPath:
      name: recognitionId
      in: path
      required: true
      schema: { type: string, pattern: '^[0-9a-f-]{36}$' }

    ReceiptIdPath:
      name: receiptId
      in: path
      required: true
      schema: { type: string, pattern: '^[0-9a-f-]{36}$' }

    ImageIdPath:
      name: imageId
      in: path
      required: true
      schema: { type: string, pattern: '^[0-9a-f-]{36}$' }

  headers:

    XRequestIdOut:
      description: Giá trị `x-request-id` của request (do FE gửi, hoặc do BE tự sinh).
      schema: { type: string, pattern: '^[A-Za-z0-9_-]{8,128}$' }

    RetryAfter:
      description: Số **giây** (làm tròn lên) client nên chờ trước khi thử lại.
      schema: { type: integer, minimum: 0 }

  schemas:

    Error:
      type: object
      required: [error]
      additionalProperties: false
      description: |
        Shape lỗi duy nhất của toàn API. `details` **được phép vắng mặt**; khi vắng, key `details`
        **không xuất hiện** (không phải `null`).
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              pattern: '^[A-Z][A-Z0-9_]*$'
              description: UPPER_SNAKE_CASE, ổn định. Client rẽ nhánh theo đây.
            message:
              type: string
              description: Tiếng Việt, hiển thị được cho người vận hành.
            details:
              type: object
              description: Tuỳ mã lỗi. Ví dụ `{retryAfterMs, simulated}`, `{fields}`, `{deviceId}`.
      examples:
        - error:
            code: DEVICE_NOT_FOUND
            message: Thiết bị chưa đăng ký
            details: { deviceId: 0d5c7f33-9d59-4d2e-8f11-0b3c9c0bd511 }

    RequestIdBody:
      type: string
      pattern: '^[A-Za-z0-9_-]{8,128}$'
      description: |
        Khoá **idempotency nghiệp vụ**. Client sinh khi bấm lưu và **giữ nguyên qua mọi lần retry**;
        chỉ đổi khi người dùng sửa dữ liệu rồi lưu lại. Khác hẳn header `x-request-id`.

    Health:
      type: object
      required: [ok, uptimeSec, provider, mockMode, simOverride, simSaveFail, db, receipts]
      additionalProperties: false
      properties:
        ok: { type: boolean }
        uptimeSec: { type: integer, minimum: 0 }
        provider: { type: string, enum: [mock, http] }
        mockMode:
          type: [string, 'null']
          enum: [success, slow, error, timeout, null]
          description: '`null` khi `RECOGNITION_PROVIDER=http`.'
        simOverride: { type: boolean }
        simSaveFail: { type: boolean }
        db: { type: string, enum: [ok, error] }
        receipts: { type: integer, minimum: 0 }

    FieldResult:
      type: object
      required: [value, confidence, raw, status]
      additionalProperties: false
      description: Một trường trong kết quả nhận dạng, **sau** khi BE đã ép kiểu và chuẩn hoá.
      properties:
        value:
          description: Giá trị đã chuẩn hoá theo kiểu của `ReceiptData`, hoặc `null`.
        confidence:
          type: number
          minimum: 0
          maximum: 1
          description: |
            **Hạ về 0** khi không chuẩn hoá được; **kẹp ≤ 0.5** khi mã (`partNumber`, `saNumber`)
            đọc được nhưng sai định dạng — giữ giá trị để người dùng sửa một ký tự.
        raw:
          type: [string, 'null']
          description: Chuỗi provider trả nguyên bản, để người dùng đối chiếu.
        status:
          type: string
          enum: [ok, unparsed, missing]
          description: '`ok` có value · `unparsed` có raw nhưng không đọc ra kiểu hợp lệ · `missing` provider không trả.'

    RecognitionResult:
      type: object
      required: [recognitionId, status, provider, fields, warnings, error, image, durationMs, createdAt, finishedAt]
      description: |
        Phase 3 **thêm** `fieldsFound` và `requestId` (tương thích ngược — chỉ thêm field, không
        đổi/xoá). `fieldsFound = 0` khi `status = "failed"` (không phải `null`).
      properties:
        recognitionId: { type: string }
        status: { type: string, enum: [pending, completed, failed] }
        provider: { type: string, enum: [mock, http] }
        fieldsFound:
          type: integer
          minimum: 0
          maximum: 13
          description: |
            Số field có `status === "ok"`. Khi `fieldsFound === 0` và `status === "completed"`,
            `warnings` chứa đúng chuỗi `Không đọc được trường nào trên nhãn`.
        fields:
          type: [object, 'null']
          description: Đủ **13 key** của schema; key nào cũng có mặt để FE không phải đoán.
          additionalProperties: { $ref: '#/components/schemas/FieldResult' }
        warnings:
          type: array
          items: { type: string }
          description: Key lạ provider trả về (schema drift), hoặc cảnh báo nghiệp vụ.
        error:
          type: [object, 'null']
          properties:
            code: { type: string }
            message: { type: string }
        image:
          type: object
          required: [id, url]
          properties:
            id: { type: string }
            url: { type: string, example: /api/images/4944ec07-2d66-4c5a-9e81-0b7c3a5d9e12 }
            mimeType: { type: string, enum: [image/jpeg, image/png, image/webp] }
            bytes: { type: integer, minimum: 0 }
        durationMs: { type: [integer, 'null'], minimum: 0 }
        requestId: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
        pollUrl:
          type: string
          description: |
            **Chỉ có ở body `202`** của `POST /api/recognitions` khi `RECOGNITION_MODE=async`;
            `GET /api/recognitions/{recognitionId}` **không** trả key này. Giá trị bằng
            `/api/recognitions/{recognitionId}`, trùng header `location`.
        pollAfterMs:
          type: integer
          minimum: 200
          maximum: 10000
          description: '**Chỉ có ở body `202`.** Bằng `RECOGNITION_POLL_HINT_MS` (mặc định `1000`), trùng header `retry-after` (làm tròn lên giây).'
      examples:
        - recognitionId: 218e4142-7a3b-4c11-9f0e-1b2c3d4e5f60
          status: completed
          provider: http
          fieldsFound: 8
          fields:
            partNumber: { value: BEX32181030AB, confidence: 0.94, raw: BEX32181030AB, status: ok }
            quantity: { value: 80, confidence: 0.91, raw: '80', status: ok }
            shipmentDate: { value: '2026-09-15', confidence: 0.62, raw: 15/9/2026, status: ok }
            supplier: { value: null, confidence: 0, raw: Foxconn, status: unparsed }
            location: { value: null, confidence: 0, raw: null, status: missing }
          warnings: []
          error: null
          image: { id: 4944ec07-2d66-4c5a-9e81-0b7c3a5d9e12, url: /api/images/4944ec07-2d66-4c5a-9e81-0b7c3a5d9e12, mimeType: image/jpeg, bytes: 148213 }
          durationMs: 702
          requestId: 9f2a41c6-2e6b-4a13-b0a9-2f45a1f8b7c3
          createdAt: '2026-09-21T14:10:00.000Z'
          finishedAt: '2026-09-21T14:10:00.702Z'

    ReceiptData:
      type: object
      required: [partNumber, partName, quantity, shipmentDate, supplier, location, batch, saNumber, variant, plantDock, grossWeight, packaging, note]
      additionalProperties: false
      description: |
        **Đúng 13 key.** Nguồn sự thật: `apps/server/src/fields.js`. Trường tuỳ chọn không nhập →
        `null`, **không bỏ key**. Client được gửi số dạng chuỗi (`"80"`, `"12,5"`); BE ép kiểu và
        **lưu đúng kiểu** dưới đây.
      properties:
        partNumber:
          type: [string, 'null']
          pattern: '^[A-Z]{3}\d{8}[A-Z]{2,6}$'
          description: Bắt buộc. Code — viết hoa, bỏ khoảng trắng. 3 chữ + 8 số + 2–6 chữ.
        partName: { type: [string, 'null'], maxLength: 120, description: Bắt buộc. }
        quantity: { type: [integer, 'null'], minimum: 1, description: Bắt buộc. JSON number thật. }
        shipmentDate:
          type: [string, 'null']
          format: date
          description: Bắt buộc. `YYYY-MM-DD`, phải là ngày **thật trên lịch**, năm 2000–2100.
        supplier:
          type: [string, 'null']
          enum: [Nội bộ — Made in Vietnam, Jiangsu Tiemao Technology, Nhà cung cấp khác, null]
          description: Bắt buộc. Kết quả nhận dạng được khớp qua alias (`VINFAST`, `Made in Vietnam`, `Tiemao`…).
        location: { type: [string, 'null'], maxLength: 40, description: Bắt buộc. Code. }
        batch: { type: [string, 'null'], maxLength: 40 }
        saNumber: { type: [string, 'null'], pattern: '^\d{10}$' }
        variant: { type: [string, 'null'], maxLength: 80 }
        plantDock: { type: [string, 'null'], maxLength: 40 }
        grossWeight: { type: [number, 'null'], minimum: 0 }
        packaging:
          type: [string, 'null']
          enum: [Nguyên vẹn, Móp nhẹ, Rách hoặc ướt, Khác, null]
        note: { type: [string, 'null'], maxLength: 1000 }

    FieldMeta:
      type: object
      description: |
        Provenance của từng trường. BE **lọc**: chỉ giữ key nằm trong schema, `via` ngoài enum →
        `manual`, `confidence` kẹp về `0..1`.
      additionalProperties:
        type: object
        required: [via, confidence, edited, proposed]
        additionalProperties: false
        properties:
          via: { type: string, enum: [ai, scan, manual] }
          confidence: { type: [number, 'null'], minimum: 0, maximum: 1 }
          edited: { type: boolean }
          proposed: { description: 'Giá trị AI/scan đề xuất ban đầu, hoặc `null`.' }

    ReceiptCreate:
      type: object
      required: [requestId, source, data]
      properties:
        requestId: { $ref: '#/components/schemas/RequestIdBody' }
        recognitionId:
          type: [string, 'null']
          description: '`null` khi nhập tay hoặc chỉ quét barcode. Được phép trỏ tới một recognition đã `failed`.'
        source: { type: string, enum: [camera, barcode, manual] }
        data: { $ref: '#/components/schemas/ReceiptData' }
        fieldMeta: { $ref: '#/components/schemas/FieldMeta' }
        allowDuplicate:
          type: boolean
          default: false
          description: |
            `true` = người vận hành đã xác nhận "vẫn lưu dù trùng nhãn". Kiểu sai (không phải
            boolean) → `400 INVALID_BODY` với `details.field = "allowDuplicate"`. `false` tường
            minh **không khác** vắng mặt.

            **Không tham gia `payloadHash`** — hệ quả **cố ý**: gửi lại cùng `requestId` với
            `allowDuplicate: true` sau khi bị `409 DUPLICATE_LABEL` không bị coi là "payload khác".
            **Phase 4.**
        client:
          type: [object, 'null']
          description: Metadata client, lưu nguyên văn.
          properties:
            submittedAt: { type: string, format: date-time }
            userAgent: { type: string }

    Receipt:
      type: object
      required:
        - receiptId
        - requestId
        - recognitionId
        - imageId
        - imageUrl
        - source
        - data
        - fieldMeta
        - client
        - createdAt
        # bảy field vòng đời thêm ở Phase 4 — luôn có mặt, không bao giờ vắng
        - status
        - sapDocumentNo
        - supersedesReceiptId
        - supersededByReceiptId
        - rejectCode
        - postAttempts
        - cancelReason
      description: |
        Bản ghi **đọc lại từ SQLite** sau khi ghi. Phase 3 thêm `deviceId`, `sessionId` (lấy từ
        header, không lấy từ body). `idempotent` chỉ có mặt trên response của `POST /api/receipts`;
        `reversalQueued` chỉ có mặt trên response của `POST /api/receipts/{receiptId}/cancel`.

        **Phase 4 thêm 7 field vòng đời**, cả 7 **luôn có mặt** (không bao giờ vắng) trên mọi
        response chứa một phiếu: `POST /api/receipts`, `GET /api/receipts/{receiptId}`, mỗi phần tử
        `items[]` của `GET /api/receipts`, `POST .../cancel`, `POST .../correct`.

        `sapMessage` (nguyên văn của SAP) **cố ý không có** ở đây — nó chỉ nằm trong
        `receipt_events.detail` và trong log, để FE không hiển thị nhầm cho người vận hành.
      properties:
        receiptId: { type: string }
        requestId: { type: string }
        recognitionId: { type: [string, 'null'] }
        imageId: { type: [string, 'null'] }
        imageUrl: { type: [string, 'null'] }
        source: { type: string, enum: [camera, barcode, manual] }
        deviceId: { type: [string, 'null'], description: '`null` khi request không mang `x-device-id`.' }
        sessionId: { type: [string, 'null'], description: '`null` khi request không mang `x-session-id`.' }
        status:
          allOf:
            - $ref: '#/components/schemas/ReceiptStatus'
          description: 'Trạng thái vòng đời hiện tại. **Không bao giờ `null`.** Phiếu vừa lưu luôn là `confirmed`. **Phase 4.**'
        sapDocumentNo:
          type: [string, 'null']
          description: 'Số chứng từ SAP; chỉ khác `null` khi `status = "posted"` — và **giữ nguyên** sau khi phiếu bị huỷ. **Phase 4.**'
          example: '5000000001'
        supersedesReceiptId:
          type: [string, 'null']
          description: 'Phiếu này được tạo ra để **thay thế** phiếu nào. **Phase 4.**'
        supersededByReceiptId:
          type: [string, 'null']
          description: 'Phiếu này **đã bị** phiếu nào thay thế. **Phase 4.**'
        rejectCode:
          type: [string, 'null']
          description: 'Mã lỗi nghiệp vụ SAP; chỉ khác `null` khi `status = "rejected"`. **Phase 4.**'
          example: SAP_PART_UNKNOWN
        postAttempts:
          type: integer
          minimum: 0
          description: |
            Số lần đã gọi SAP cho phiếu này (`0` khi chưa gửi). Đọc từ `outbox.attempts`, hoặc từ
            `receipts.post_attempts` khi job đã bị xoá (phiếu `posted`/`rejected`). **Phase 4.**
        cancelReason:
          type: [string, 'null']
          description: 'Lý do huỷ; chỉ khác `null` khi `status = "cancelled"`. **Phase 4.**'
        data: { $ref: '#/components/schemas/ReceiptData' }
        fieldMeta: { $ref: '#/components/schemas/FieldMeta' }
        client: { type: [object, 'null'] }
        createdAt: { type: string, format: date-time }
        idempotent: { type: boolean, description: '`true` ⇔ HTTP 200 (bản ghi đã tồn tại).' }

    ReceiptStatus:
      type: string
      enum: [confirmed, posting, posted, post_failed, rejected, cancelled, corrected, superseded]
      description: |
        **Đúng 8 giá trị.** `draft` và `queued` (có trong bản 0.3.0 của file này và trong
        `docs/receipt-lifecycle.md`) là trạng thái **chỉ tồn tại trên PDA ở Phase 5**; server
        **không bao giờ** trả hai giá trị đó, và chúng đã bị gỡ khỏi enum ở bản 0.4.0.

        | Giá trị | Nghĩa | Kết thúc? |
        |---|---|---|
        | `confirmed` | Đã nằm trong SQLite, chưa gửi SAP (hoặc chưa tới lượt) | không |
        | `posting` | Đang gửi SAP, hoặc đang chờ lượt retry trong outbox | không |
        | `posted` | SAP đã nhận, có `sapDocumentNo` | gần như — chỉ rời đi được khi bị huỷ |
        | `post_failed` | Hết lượt vì lỗi **kỹ thuật**. Dữ liệu vẫn đúng | không |
        | `rejected` | SAP từ chối vì lỗi **nghiệp vụ**. Gửi lại y hệt sẽ hỏng y hệt | không |
        | `cancelled` | Người vận hành đã huỷ | **có** |
        | `corrected` | Phiếu **mới** sinh ra từ thao tác "Sửa", có `supersedesReceiptId` | không |
        | `superseded` | Phiếu **cũ** đã bị một phiếu `corrected` thay thế. Đóng băng | **có** |

        Chi tiết state machine: `docs/receipt-lifecycle.md`.

    ReceiptCounts:
      type: object
      required: [total, byStatus]
      additionalProperties: false
      description: |
        Đếm theo trạng thái cho các chip lọc của màn hình S6 và ô số của S2. Tính trên **cùng bộ
        lọc `sessionId` + `deviceId`** nhưng **bỏ qua** `status`, `limit`, `cursor`. **Phase 4.**
      properties:
        total: { type: integer, minimum: 0, description: 'Tổng 8 giá trị của `byStatus`.' }
        byStatus:
          type: object
          required: [confirmed, posting, posted, post_failed, rejected, cancelled, corrected, superseded]
          additionalProperties: false
          description: '**Luôn đủ 8 key**, giá trị `0` khi không có phiếu nào. Không bao giờ vắng key.'
          properties:
            confirmed: { type: integer, minimum: 0 }
            posting: { type: integer, minimum: 0 }
            posted: { type: integer, minimum: 0 }
            post_failed: { type: integer, minimum: 0 }
            rejected: { type: integer, minimum: 0 }
            cancelled: { type: integer, minimum: 0 }
            corrected: { type: integer, minimum: 0 }
            superseded: { type: integer, minimum: 0 }

    ReceiptEventName:
      type: string
      enum:
        - receipt.confirmed
        - receipt.duplicate_override
        - receipt.posting
        - receipt.posted
        - receipt.post_retry
        - receipt.post_failed
        - receipt.rejected
        - receipt.retry_requested
        - receipt.cancelled
        - receipt.reversal_queued
        - receipt.reversal_posted
        - receipt.reversal_failed
        - receipt.corrected
        - receipt.superseded
        - receipt.swept
      description: |
        **Đúng 15 tên sự kiện ổn định.** Khác với `to` vì một trạng thái có thể vào từ nhiều sự
        kiện (`posting` vào từ `receipt.posting` lẫn `receipt.retry_requested`).

        | `event` | `from` → `to` | `actor.kind` | `detail` chứa |
        |---|---|---|---|
        | `receipt.confirmed` | `null` → `confirmed` | `device` | `{source, requestId, fieldsEdited}` |
        | `receipt.duplicate_override` | `confirmed` → `confirmed` | `device` | `{existingReceiptId, key}` |
        | `receipt.posting` | `confirmed\|corrected\|post_failed\|posting` → `posting` | `system` | `{attempt}` |
        | `receipt.posted` | `posting` → `posted` | `system` | `{sapDocumentNo, postedAt, attempt}` |
        | `receipt.post_retry` | `posting` → `posting` | `system` | `{attempt, code, nextAttemptAt, delayMs}` |
        | `receipt.post_failed` | `posting` → `post_failed` | `system` | `{attempt, code, lastError}` |
        | `receipt.rejected` | `posting` → `rejected` | `system` | `{code, sapMessage, attempt}` |
        | `receipt.retry_requested` | `post_failed` → `posting` | `operator` | `{}` |
        | `receipt.cancelled` | bất kỳ → `cancelled` | `operator` | `{reason, hadSapDocumentNo}` |
        | `receipt.reversal_queued` | `cancelled` → `cancelled` | `system` | `{sapDocumentNo}` |
        | `receipt.reversal_posted` | `cancelled` → `cancelled` | `system` | `{sapDocumentNo, attempt}` |
        | `receipt.reversal_failed` | `cancelled` → `cancelled` | `system` | `{sapDocumentNo, attempt, code}` |
        | `receipt.corrected` | `null` → `corrected` | `operator` | `{supersedesReceiptId, reason}` — ghi cho phiếu **mới** |
        | `receipt.superseded` | `<cũ>` → `superseded` | `operator` | `{supersededByReceiptId, reason}` — ghi cho phiếu **cũ** |
        | `receipt.swept` | `posting` → `posting` | `system` | `{sweep, attempt}` |

    ReceiptEvent:
      type: object
      required: [id, receiptId, at, from, to, event, actor, detail]
      description: |
        Một dòng của bảng `receipt_events` — nhật ký **chỉ INSERT** (không `UPDATE`, không `DELETE`,
        không bao giờ). Mỗi chuyển trạng thái ghi **đúng một** dòng, trong **cùng transaction** với
        `UPDATE receipts.status`. Hai dòng cho một lần chuyển nghĩa là worker đã chạy hai lần — đó
        là bug cần thấy được. **Phase 4.**
      properties:
        id: { type: integer, description: 'Tăng dần; thứ tự `id` **là** thứ tự thời gian thật.' }
        receiptId: { type: string }
        at: { type: string, format: date-time, description: '**Server sinh.** Không bao giờ lấy giờ của PDA.' }
        from:
          type: [string, 'null']
          description: 'Trạng thái trước; `null` **chỉ** ở sự kiện đầu tiên của phiếu.'
        to: { $ref: '#/components/schemas/ReceiptStatus' }
        event: { $ref: '#/components/schemas/ReceiptEventName' }
        actor:
          type: object
          required: [kind, deviceId, sessionId]
          additionalProperties: false
          properties:
            kind:
              type: string
              enum: [device, system, operator]
              description: '`device` = PDA tự động · `operator` = người bấm nút · `system` = worker/sweep.'
            deviceId: { type: [string, 'null'], description: '`null` khi `kind = "system"`.' }
            sessionId: { type: [string, 'null'], description: '`null` khi `kind = "system"`.' }
        detail:
          type: object
          description: |
            **Luôn là object** (ít nhất `{}`), không bao giờ `null`. Chỉ chứa bối cảnh của lần
            chuyển, **không** chứa dữ liệu nghiệp vụ (đã có trong `receipts.data`).

    MasterLocation:
      type: object
      required: [code, zone, name, active]
      additionalProperties: false
      description: 'Một dòng của `master-data/locations.csv`. **Phase 4.**'
      properties:
        code: { type: string, example: A-03-02 }
        zone: { type: string, example: A }
        name: { type: string, example: Khu A · Kệ 03 · Tầng 02 }
        active: { type: boolean, description: 'Cột CSV `1` → `true`, mọi giá trị khác → `false`.' }

    MasterWarehouse:
      type: object
      required: [code, name, active]
      additionalProperties: false
      description: 'Một kho. FE gửi **`name`** lên `POST /api/sessions/start`, không gửi `code`. **Phase 4.**'
      properties:
        code: { type: string, example: LB }
        name: { type: string, maxLength: 80, example: Kho Long Biên }
        active: { type: boolean }

    MasterShift:
      type: object
      required: [code, name, startsAt, endsAt]
      additionalProperties: false
      description: 'Một ca làm việc. **Phase 4.**'
      properties:
        code:
          type: string
          enum: [sang, chieu, dem]
          description: |
            **Không** nullable ở đây (khác `schemas.Shift` của `sessions`, nơi `null` là hợp lệ).
            Ba giá trị này trùng khít hằng `SHIFTS` trong `apps/server/src/sessions.js`.
        name: { type: string, example: Ca sáng }
        startsAt: { type: string, pattern: '^[0-2][0-9]:[0-5][0-9]$', example: '06:00' }
        endsAt: { type: string, pattern: '^[0-2][0-9]:[0-5][0-9]$', example: '14:00' }

    Device:
      type: object
      required: [id, name, appVersion, platform, network, screen, status, lastSeenAgeMs, firstSeen, lastSeen, meta, battery, pendingQueue]
      properties:
        id: { type: string }
        name: { type: [string, 'null'], minLength: 1, maxLength: 60 }
        appVersion: { type: [string, 'null'], maxLength: 32 }
        platform: { type: [string, 'null'], maxLength: 120 }
        network: { $ref: '#/components/schemas/Network' }
        screen: { type: [string, 'null'], maxLength: 16, description: 'Mã màn hình đang mở, ví dụ `S3`.' }
        status:
          type: string
          enum: [online, stale, offline]
          description: |
            Tính tại thời điểm trả response: `age < 45000` → `online`; `age < 300000` → `stale`;
            `age >= 300000` → `offline`.
        lastSeenAgeMs: { type: integer, minimum: 0 }
        firstSeen: { type: string, format: date-time }
        lastSeen: { type: string, format: date-time }
        meta: { type: object, description: 'JSON bất kỳ, serialize ≤ 4096 byte (vượt → lưu `{}`).' }
        battery:
          type: [number, 'null']
          minimum: 0
          maximum: 1
          description: |
            **Phase 5.** Giá trị heartbeat gần nhất, là **tỉ lệ 0..1** (không phải phần trăm):
            pin 12 % lưu thành `0.12`. Thiết bị chưa bao giờ báo pin → `null`.
        pendingQueue:
          type: integer
          minimum: 0
          description: |
            **Phase 5.** Số phiếu đang nằm trong hàng chờ ngoại tuyến của thiết bị, do chính
            thiết bị tự khai trong heartbeat. Thiết bị mất mạng thì con số này **đứng yên** —
            nó chỉ nhảy lên khi có mạng trở lại và heartbeat tới được máy chủ.

    DeviceListItem:
      allOf:
        - $ref: '#/components/schemas/Device'
        - type: object
          required: [activeSessionId, sim, session, receiptsInSession]
          properties:
            activeSessionId: { type: [string, 'null'] }
            sim:
              type: object
              required: [hasOverride]
              properties:
                hasOverride: { type: boolean, description: Có dòng `sim_state` scope `device:<id>` hay không. }
            session:
              description: |
                **Phase 5.** Tóm tắt phiên đang mở, để màn hình giám sát khỏi phải gọi thêm
                `GET /api/sessions/:id` cho từng dòng. Không có phiên đang mở → `null`.
                Trùng thông tin với `activeSessionId` là **có chủ ý**.
              oneOf:
                - type: object
                  required: [id, operator, warehouse, shift, startedAt]
                  additionalProperties: false
                  properties:
                    id: { type: string }
                    operator: { type: [string, 'null'] }
                    warehouse: { type: [string, 'null'] }
                    shift: { $ref: '#/components/schemas/Shift' }
                    startedAt: { type: string, format: date-time }
                - type: 'null'
            receiptsInSession:
              type: integer
              minimum: 0
              description: '**Phase 5.** `SELECT COUNT(*) FROM receipts WHERE session_id = :activeSessionId`. Không có phiên đang mở → `0`.'

    DeviceEnvelope:
      type: object
      required: [device, serverTime, heartbeatIntervalMs]
      properties:
        device: { $ref: '#/components/schemas/Device' }
        created: { type: boolean, description: '`true` chỉ ở lần đầu (kèm HTTP 201).' }
        serverTime: { type: string, format: date-time }
        heartbeatIntervalMs:
          type: integer
          const: 15000
          description: '**Luôn 15000.** FE dùng số này, không hard-code.'

    DeviceRegister:
      type: object
      additionalProperties: false
      properties:
        deviceId:
          type: string
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
          description: Bắt buộc **ở đây hoặc ở header** `x-device-id`. Có cả hai mà khác → `400 DEVICE_ID_MISMATCH`.
        name: { type: [string, 'null'], minLength: 1, maxLength: 60, description: 'Trim; `""` → `null`.' }
        appVersion: { type: [string, 'null'], maxLength: 32 }
        platform: { type: [string, 'null'], maxLength: 120 }
        network: { $ref: '#/components/schemas/Network' }
        screen: { type: [string, 'null'], maxLength: 16 }
        meta: { type: object }

    DeviceHeartbeat:
      type: object
      additionalProperties: false
      description: Field vắng mặt → **giữ giá trị cũ** (trừ `battery` và `pendingQueue`).
      properties:
        appVersion: { type: [string, 'null'], maxLength: 32 }
        network: { $ref: '#/components/schemas/Network' }
        battery:
          type: [number, 'null']
          minimum: 0
          maximum: 1
          description: '**Tỉ lệ 0..1**, không phải phần trăm. Ngoài khoảng → kẹp về biên, **không** báo lỗi.'
        pendingQueue:
          type: integer
          minimum: 0
          default: 0
          description: Số phiếu đang chờ đồng bộ ở FE. **Phase 3–4 luôn `0`**; có giá trị thật từ **Phase 5**.
        screen: { type: [string, 'null'], maxLength: 16 }
        meta:
          type: [object, 'null']
          additionalProperties: true
          description: >-
            Dữ liệu phụ do thiết bị tự khai (ví dụ `netSim` = kịch bản mạng đang áp, userAgent,
            kích thước màn hình). BE lưu nguyên và trả lại trong `GET /api/devices`; màn hình giám sát
            dùng `meta.netSim` để hiện cột Mạng. Field vắng mặt thì giữ giá trị cũ; quá lớn thì BE bỏ hẳn
            thay vì cắt giữa chừng.

    Network:
      type: string
      enum: [wifi, cellular, ethernet, offline, unknown]
      default: unknown

    Shift:
      type: [string, 'null']
      enum: [sang, chieu, dem, null]

    EndReason:
      type: string
      enum: [manual, timeout, superseded]
      default: manual

    Session:
      type: object
      required: [id, deviceId, operator, warehouse, shift, startedAt, endedAt, endReason, summary]
      properties:
        id: { type: string }
        deviceId: { type: string, description: 'Quan hệ 1-1: một phiên chỉ thuộc một thiết bị. Đổi thiết bị = phiên mới.' }
        operator: { type: [string, 'null'], minLength: 1, maxLength: 80 }
        warehouse: { type: [string, 'null'], minLength: 1, maxLength: 80 }
        shift: { $ref: '#/components/schemas/Shift' }
        startedAt: { type: string, format: date-time }
        endedAt: { type: [string, 'null'], format: date-time }
        endReason: { type: [string, 'null'], enum: [manual, timeout, superseded, null] }
        summary:
          type: object
          required: [receipts, recognitions, recognitionsFailed]
          description: Tính bằng SQL tại thời điểm đọc, không lưu sẵn.
          properties:
            receipts: { type: integer, minimum: 0 }
            recognitions: { type: integer, minimum: 0 }
            recognitionsFailed: { type: integer, minimum: 0 }

    SessionStart:
      type: object
      additionalProperties: false
      properties:
        deviceId:
          type: string
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
          description: Bắt buộc ở đây **hoặc** ở header `x-device-id`.
        operator: { type: [string, 'null'], minLength: 1, maxLength: 80 }
        warehouse: { type: [string, 'null'], minLength: 1, maxLength: 80 }
        shift: { $ref: '#/components/schemas/Shift' }

    BackendMode:
      type: string
      enum: [normal, degraded, readonly, down]
      default: normal

    OcrMode:
      type: string
      enum: [success, slow, error, timeout, partial, garbage, lowConfidence]
      default: success
      description: |
        `slow` chờ `max(delayMs, 6000)` ms · `error` và `timeout` **không gọi provider** ·
        `partial` xoá đúng 3 trường cố định (`partNumber`, `shipmentDate`, `supplier`) ·
        `garbage` ghi đè 3 trường bằng chuỗi rác · `lowConfidence` đặt `confidence = 0.3` cho mọi trường.

    SaveMode:
      type: string
      enum: [normal, fail, slow]
      default: normal
      description: '`fail` → `503 SAVE_FAILED_SIMULATED`, **không** ghi DB · `slow` chờ `max(latencyMs, 8000)` ms.'

    SapMode:
      type: string
      enum: [success, slow, reject, down]
      default: success
      description: |
        Phase 3 **chỉ lưu và phản chiếu, không dùng**. Từ **Phase 4** nó điều khiển SAP mock thật:
        `success` chờ `SAP_MOCK_SUCCESS_DELAY_MS` (300) · `slow` chờ `SAP_MOCK_SLOW_DELAY_MS`
        (8000, vượt timeout → `SAP_TIMEOUT`, đó chính là điểm demo) · `reject` ném lỗi **nghiệp vụ**
        `SAP_PART_UNKNOWN` · `down` ném **ngay** `SAP_UNAVAILABLE`, không chờ.

        `sim.sap.latencyMs` **cộng thêm** vào độ trễ ở **mọi** mode trừ `down`.

        **SAP mock chỉ nghe kịch bản TOÀN CỤC** (`PUT /api/admin/sim`). Kịch bản theo thiết bị
        (`PUT /api/admin/sim/devices/{deviceId}`) **không** ảnh hưởng SAP: SAP là hệ thống ở đầu
        kia của Main Backend, nó không biết phiếu đến từ PDA nào. Kịch bản theo thiết bị chỉ có
        nghĩa cho `backend`/`ocr`/`save` — những thứ nằm trên đường đi của **request** từ thiết bị đó.

    Scenario:
      type: object
      required: [backend, ocr, save, sap]
      additionalProperties: false
      description: |
        Kịch bản mô phỏng **đầy đủ** (đã trộn). Không có key nào khác được chấp nhận.
        Giá trị mặc định `SIM_DEFAULT` chính là ví dụ dưới đây.
      properties:
        backend:
          type: object
          required: [mode, latencyMs]
          additionalProperties: false
          properties:
            mode: { $ref: '#/components/schemas/BackendMode' }
            latencyMs: { type: integer, minimum: 0, maximum: 30000, default: 0 }
        ocr:
          type: object
          required: [mode, delayMs]
          additionalProperties: false
          properties:
            mode: { $ref: '#/components/schemas/OcrMode' }
            delayMs: { type: integer, minimum: 0, maximum: 30000, default: 0 }
        save:
          type: object
          required: [mode, latencyMs]
          additionalProperties: false
          properties:
            mode: { $ref: '#/components/schemas/SaveMode' }
            latencyMs: { type: integer, minimum: 0, maximum: 30000, default: 0 }
        sap:
          type: object
          required: [mode, latencyMs]
          additionalProperties: false
          properties:
            mode: { $ref: '#/components/schemas/SapMode' }
            latencyMs: { type: integer, minimum: 0, maximum: 30000, default: 0 }
      examples:
        - backend: { mode: normal, latencyMs: 0 }
          ocr: { mode: success, delayMs: 0 }
          save: { mode: normal, latencyMs: 0 }
          sap: { mode: success, latencyMs: 0 }

    SimScenario:
      $ref: '#/components/schemas/Scenario'

    ScenarioPatch:
      type: object
      additionalProperties: false
      description: |
        Patch **từng phần**, trộn ở **cấp field**. Body rỗng `{}` là hợp lệ. Key lạ ở cấp 1 hoặc cấp 2
        → `400 INVALID_SIM_CONFIG` với `details.unknownKeys`.
      properties:
        backend:
          type: object
          additionalProperties: false
          properties:
            mode: { $ref: '#/components/schemas/BackendMode' }
            latencyMs: { type: integer, minimum: 0, maximum: 30000 }
        ocr:
          type: object
          additionalProperties: false
          properties:
            mode: { $ref: '#/components/schemas/OcrMode' }
            delayMs: { type: integer, minimum: 0, maximum: 30000 }
        save:
          type: object
          additionalProperties: false
          properties:
            mode: { $ref: '#/components/schemas/SaveMode' }
            latencyMs: { type: integer, minimum: 0, maximum: 30000 }
        sap:
          type: object
          additionalProperties: false
          properties:
            mode: { $ref: '#/components/schemas/SapMode' }
            latencyMs: { type: integer, minimum: 0, maximum: 30000 }

    SimAdminState:
      type: object
      required: [enabled, default, global, devices, updatedAt, serverTime]
      properties:
        enabled: { type: boolean, description: Giá trị `SIM_OVERRIDE`. }
        default: { $ref: '#/components/schemas/Scenario' }
        global: { $ref: '#/components/schemas/Scenario' }
        devices:
          type: object
          description: Map `deviceId` → **object thô đã lưu** (chỉ các key người dùng đặt). Không có device nào → `{}`.
          additionalProperties: { $ref: '#/components/schemas/ScenarioPatch' }
        updatedAt: { type: [string, 'null'], format: date-time }
        serverTime: { type: string, format: date-time }

    SimDeviceState:
      type: object
      required: [enabled, deviceId, deviceKnown, device, effectiveForDevice, updatedAt, serverTime]
      properties:
        enabled: { type: boolean }
        deviceId: { type: string }
        deviceKnown: { type: boolean, description: '`false` khi thiết bị chưa đăng ký — vẫn được phép đặt kịch bản.' }
        device: { oneOf: [{ $ref: '#/components/schemas/ScenarioPatch' }, { type: 'null' }] }
        effectiveForDevice: { $ref: '#/components/schemas/Scenario' }
        updatedAt: { type: [string, 'null'], format: date-time }
        serverTime: { type: string, format: date-time }

    # ──────────────── Phase 5 — sổ sự kiện toàn hệ thống (`system_events`) ────────────────

    EventSeverity:
      type: string
      enum: [info, warn, error]
      description: |
        Mỗi `type` có một severity **mặc định** do bảng `EVENT_TYPES` (`apps/server/src/events.js`)
        quyết định; nơi ghi sự kiện có thể ghi đè. Màn hình giám sát tô màu theo trường này.

    SystemEventType:
      type: string
      description: |
        **31 giá trị** = 16 loại hệ thống + 15 loại `receipt.*`. Nguồn sự thật duy nhất là hằng
        `EVENT_TYPES` trong `apps/server/src/events.js`; `type` ngoài bảng đó làm `events.write()`
        **ném lỗi** (đó là bug lập trình, ghi im lặng sẽ giấu nó tới tận lúc demo).

        Các loại `receipt.*` vào đây bằng cơ chế **gương**: mỗi lần ghi `receipt_events`, một dòng
        tương ứng được ghi sang `system_events`. Hai bảng vẫn tách biệt — `receipt_events` là sổ
        kiểm toán **vĩnh viễn**, `system_events` là sổ quan sát **có cắt vòng xoay**.
      enum:
        - server.start
        - server.stop
        - sim.updated
        - sim.cleared
        - device.registered
        - device.camera_error
        - device.battery_low
        - device.queue_enqueued
        - device.queue_synced
        - device.sim_changed
        - session.started
        - session.ended
        - recognition.started
        - recognition.completed
        - recognition.failed
        - recognition.rejected_busy
        - receipt.confirmed
        - receipt.duplicate_override
        - receipt.posting
        - receipt.posted
        - receipt.post_retry
        - receipt.post_failed
        - receipt.rejected
        - receipt.retry_requested
        - receipt.cancelled
        - receipt.reversal_queued
        - receipt.reversal_posted
        - receipt.reversal_failed
        - receipt.corrected
        - receipt.superseded
        - receipt.swept

    ClientEventType:
      type: string
      enum: [device.camera_error, device.battery_low, device.queue_enqueued, device.queue_synced, device.sim_changed]
      description: |
        **Danh sách trắng đúng 5 giá trị** mà PDA được phép tự gửi (`CLIENT_EVENT_TYPES` trong
        `apps/server/src/events.js`). `session.started` **không** nằm trong danh sách: BE đã tự ghi
        nó ở `POST /api/sessions/start`, để PDA gửi thêm sẽ thành hai dòng cho cùng một việc.
        Giá trị ngoài danh sách → `400 INVALID_EVENT_TYPE` và cả lô bị từ chối.

    SystemEvent:
      type: object
      required: [id, at, type, severity, deviceId, sessionId, receiptId, recognitionId, clientAt, detail]
      additionalProperties: false
      description: Một dòng của bảng `system_events`. **Mọi key luôn có mặt**; key không áp dụng là `null`.
      properties:
        id:
          type: integer
          minimum: 1
          description: Khoá chính tự tăng — đồng thời là **con trỏ phân trang** của `?since=`.
        at:
          type: string
          format: date-time
          description: Giờ **server**. Giờ do PDA khai nằm ở `clientAt`, không bao giờ vào đây.
        type: { $ref: '#/components/schemas/SystemEventType' }
        severity: { $ref: '#/components/schemas/EventSeverity' }
        deviceId: { type: [string, 'null'] }
        sessionId: { type: [string, 'null'] }
        receiptId: { type: [string, 'null'] }
        recognitionId: { type: [string, 'null'] }
        clientAt:
          type: [string, 'null']
          format: date-time
          description: Giờ do PDA tự khai, chỉ để tham khảo. Không gửi hoặc sai định dạng → `null`. **Không bao giờ** dùng để sắp xếp.
        detail:
          type: object
          description: 'JSON tuỳ loại sự kiện; không có gì → `{}`. JSON hoá vượt **2048 byte** → thay hẳn bằng `{"_truncated": true}` (cắt giữa chừng sẽ không parse lại được).'

    DeviceEventIn:
      type: object
      required: [type]
      additionalProperties: false
      description: Một phần tử của lô mà PDA gửi lên `POST /api/devices/{deviceId}/events`.
      properties:
        type: { $ref: '#/components/schemas/ClientEventType' }
        at:
          type: string
          format: date-time
          description: Giờ client, lưu vào cột `client_at`. Sai định dạng → **bỏ qua**, không báo lỗi.
        detail:
          type: object
          description: 'Không phải object → lưu `{}`. Vượt 2048 byte → lưu `{"_truncated": true}`.'

    DeviceEventBatch:
      type: object
      required: [events]
      additionalProperties: false
      properties:
        events:
          type: array
          minItems: 1
          maxItems: 20
          description: Không phải mảng, rỗng, hoặc quá **20** phần tử → `400 INVALID_BODY` với `details = {field, max}`.
          items: { $ref: '#/components/schemas/DeviceEventIn' }

    AdminRecognition:
      type: object
      required: [recognitionId, status, provider, deviceId, sessionId, imageId, createdAt, finishedAt, durationMs, ageMs, fieldsFound, errorCode]
      additionalProperties: false
      description: |
        Một dòng của bảng `recognitions`, **rút gọn cho người giám sát**. Cố ý **không** có
        `fields` / `rawText`: monitor không cần dữ liệu nhãn, và đó là dữ liệu nghiệp vụ.
      properties:
        recognitionId: { type: string }
        status: { type: string, enum: [pending, completed, failed] }
        provider: { type: string, enum: [mock, http] }
        deviceId: { type: [string, 'null'] }
        sessionId: { type: [string, 'null'] }
        imageId: { type: string }
        createdAt: { type: string, format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time, description: '`null` khi còn `pending`.' }
        durationMs: { type: [integer, 'null'], minimum: 0, description: '`null` khi còn `pending`.' }
        ageMs:
          type: [integer, 'null']
          minimum: 0
          description: '`serverTime - createdAt`, do **server** tính — không bao giờ tin đồng hồ client. `createdAt` không parse được → `null`.'
        fieldsFound:
          type: integer
          minimum: 0
          description: Số trường đọc được từ `normalized`. Còn `pending`, thất bại, hoặc `normalized` hỏng → `0`.
        errorCode: { type: [string, 'null'], description: 'Mã lỗi khi `status = "failed"`; ngược lại `null`.' }

    StatusResponse:
      type: object
      required: [backend, ocr, sap, queue, recognition, sim, serverTime, version]
      additionalProperties: false
      description: Mọi key **luôn có mặt**; không có key nào là tuỳ chọn.
      properties:
        backend:
          type: object
          required: [state, readonly, latencyMs, uptimeSec, simulated]
          additionalProperties: false
          properties:
            state:
              type: string
              enum: [up, degraded, readonly, down]
              description: |
                Ánh xạ 1-1 từ `sim.effective.backend.mode`: `normal→up`, `degraded→degraded`,
                `readonly→readonly`, `down→down`. Khi `SIM_OVERRIDE=false` **luôn** là `up`.
            readonly: { type: boolean, description: '`true` ⇔ `state === "readonly"`.' }
            latencyMs: { type: integer, minimum: 0 }
            uptimeSec: { type: integer, minimum: 0 }
            simulated: { type: boolean, description: '`true` khi `state !== "up"` **hoặc** `latencyMs > 0`.' }
        ocr:
          type: object
          required: [reachable, configured, ready, simMode, mode, model, provider, checkedAt, latencyMs, cached]
          additionalProperties: false
          description: |
            `ready` và `simMode` là **ĐÍNH CHÍNH R7** của `docs/specs/phase-3/01-contracts.md` §5.1
            (bản 0.4.0 của file này bổ sung — trước đó hai trường có trong code mà thiếu trong hợp
            đồng). FE quyết định màu đèn OCR bằng `ready`, **không** bằng `configured`.
          properties:
            reachable: { type: boolean, description: 'Provider `mock` → luôn `true`.' }
            configured: { type: boolean, description: 'Provider `http`: `Boolean(body.configured)` từ probe; probe lỗi → `false`. Chỉ mang tính thông tin.' }
            ready:
              type: boolean
              description: |
                **Có phục vụ được `POST /recognize` hay không** = `configured === true` **HOẶC**
                `simMode !== "passthrough"`. Provider `mock` → luôn `true`; probe lỗi → `false`.
                Đèn OCR của PDA: xanh khi `reachable && ready`, vàng khi `reachable && !ready`,
                đỏ khi `!reachable`.
            simMode:
              type: [string, 'null']
              description: 'Giá trị `OCR_SIM_MODE` của ai-server. Provider `mock` hoặc probe lỗi → `null`.'
            mode: { $ref: '#/components/schemas/OcrMode' }
            model: { type: [string, 'null'], description: 'Provider `mock` → `"mock-vlm-0"`. Khi `simMode` khác `passthrough` → `"sim-" + simMode`.' }
            provider: { type: string, enum: [mock, http] }
            checkedAt: { type: string, format: date-time, description: 'Thời điểm probe **thật sự chạy**, không phải thời điểm request.' }
            latencyMs: { type: [integer, 'null'], minimum: 0 }
            cached: { type: boolean, description: '`true` nếu dùng kết quả probe cũ trong TTL 10000 ms.' }
        sap:
          type: object
          required: [reachable, mode]
          additionalProperties: false
          description: |
            **Đúng 2 key, không thêm key nào.** Ở Phase 3 giá trị **luôn** là
            `{"reachable": false, "mode": "not_configured"}`. Từ **Phase 4** nó phản ánh adapter
            đang chạy — xem bảng đầy đủ ở `description` của `GET /api/status`. Giá trị
            `not_configured` từ đó về sau chỉ có nghĩa **`SAP_ADAPTER=none`**.
          properties:
            reachable:
              type: boolean
              description: '`(SAP_ADAPTER !== "none") && (sim.effective.sap.mode !== "down")`.'
            mode:
              type: string
              enum: [not_configured, success, slow, reject, down]
              description: '`SAP_ADAPTER === "none"` → `not_configured`; ngược lại = `sim.effective.sap.mode`.'
        queue:
          type: object
          required: [recognitionsInflight, recognitionsWaiting, outboxPending, recognitionsPending, recognitionsFailedRecent]
          additionalProperties: false
          description: |
            Ba key đầu là hợp đồng Phase 3–4. Hai key cuối **mới ở Phase 5**: chúng đếm trong
            **bảng `recognitions`**, không phải trong semaphore, nên chúng vẫn có nghĩa khi
            `RECOGNITION_MODE=async` và công việc chạy nền sau khi PDA đã rời trang.
          properties:
            recognitionsInflight: { type: integer, minimum: 0, maximum: 3 }
            recognitionsWaiting: { type: integer, minimum: 0, maximum: 10 }
            outboxPending:
              type: integer
              minimum: 0
              description: |
                **Luôn `0`** ở Phase 3. Từ **Phase 4**:
                `SELECT COUNT(*) FROM outbox WHERE state = 'pending'` — đếm cả `kind='post'` lẫn
                `kind='reversal'`; `state='failed'` **không** tính. `SAP_ADAPTER=none` → `0`.
            recognitionsPending:
              type: integer
              minimum: 0
              description: |
                **Phase 5.** Số dòng `recognitions` đang ở `status = 'pending'` — tức công việc
                nhận dạng **chưa kết thúc**, kể cả khi PDA đã đóng tab. Ở `RECOGNITION_MODE=sync`
                con số này gần như luôn bằng `recognitionsInflight`.
            recognitionsFailedRecent:
              type: integer
              minimum: 0
              description: |
                **Phase 5.** Số lần nhận dạng thất bại gần đây, để dải trạng thái của màn hình
                giám sát đổi màu khi OCR đang hỏng.
        recognition:
          type: object
          required: [mode, maxConcurrent, maxWaiting, timeoutMs, pollHintMs]
          additionalProperties: false
          description: |
            **Khoá cấp một MỚI của Phase 5**, nằm ngay sau `queue`. Đúng **5 key**, tất cả đọc
            thẳng từ config — không đọc DB. FE dùng `mode` để **tự biết** đi đường `sync` hay
            `async` mà không cần biến build-time.
          properties:
            mode:
              type: string
              enum: [sync, async]
              description: |
                `RECOGNITION_MODE`. **Mặc định `sync`** (giữ nguyên hành vi Phase 1–4:
                `POST /api/recognitions` trả `201` kèm kết quả). `async` → `202` + `pollUrl`.
            maxConcurrent: { type: integer, minimum: 1, description: '`RECOGNITION_MAX_CONCURRENT`, mặc định `3`.' }
            maxWaiting: { type: integer, minimum: 0, description: '`RECOGNITION_MAX_WAITING`, mặc định `10`. Vượt → `429 RECOGNITION_BUSY`.' }
            timeoutMs: { type: integer, minimum: 1, description: '`RECOGNITION_TIMEOUT_MS`, mặc định `20000`. Ngân sách dùng chung cho cả 2 attempt.' }
            pollHintMs:
              type: integer
              minimum: 200
              maximum: 10000
              description: '`RECOGNITION_POLL_HINT_MS`, mặc định `1000`. Client chờ ngần này rồi mới poll lần đầu.'
        sim:
          type: object
          required: [enabled, scope, effective, global, device, updatedAt]
          additionalProperties: false
          properties:
            enabled: { type: boolean }
            scope: { type: string, enum: [device, global, none] }
            effective: { $ref: '#/components/schemas/Scenario' }
            global: { oneOf: [{ $ref: '#/components/schemas/Scenario' }, { type: 'null' }] }
            device: { oneOf: [{ $ref: '#/components/schemas/ScenarioPatch' }, { type: 'null' }] }
            updatedAt: { type: [string, 'null'], format: date-time }
        serverTime: { type: string, format: date-time }
        version: { type: string, description: 'Đọc từ `apps/server/package.json`, **không** từ `package.json` root.' }

    Status:
      $ref: '#/components/schemas/StatusResponse'

  responses:

    Err400:
      description: |
        Request sai hình thức. `code` có thể là `INVALID_JSON`, `INVALID_BODY`, `INVALID_REQUEST_ID`,
        `INVALID_RECOGNITION_ID`, `INVALID_SOURCE`, `INVALID_SIM`, `INVALID_SIM_CONFIG`,
        `IMAGE_REQUIRED`, `IMAGE_EMPTY`, `INVALID_MULTIPART`, `DEVICE_REQUIRED`,
        `INVALID_DEVICE_ID`, `DEVICE_ID_MISMATCH`, và **từ Phase 4** `INVALID_QUERY`
        (`details = {field, allowed?}`), `INVALID_CURSOR` (`details = {cursor}`).

        **Từ Phase 5:** `INVALID_SINCE` (`details = {since}`, chỉ ở `GET /api/admin/events`) và
        `INVALID_EVENT_TYPE` (`details = {type, allowed}`, chỉ ở
        `POST /api/devices/{deviceId}/events`).
      headers:
        x-request-id:
          $ref: '#/components/headers/XRequestIdOut'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error:
              code: INVALID_DEVICE_ID
              message: x-device-id phải là UUID v4 chữ thường
              details: { deviceId: 0D5C7F33-9D59-4D2E-8F11-0B3C9C0BD511 }

    Err403:
      description: Mô phỏng đang tắt. Áp dụng cho **mọi** method của `/api/admin/sim*`, kể cả `GET`.
      headers:
        x-request-id:
          $ref: '#/components/headers/XRequestIdOut'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error:
              code: SIM_DISABLED
              message: Mô phỏng đang tắt (SIM_OVERRIDE=false)

    Err404:
      description: Không tìm thấy. `code` là `NOT_FOUND`, `DEVICE_NOT_FOUND` hoặc `SESSION_NOT_FOUND`.
      headers:
        x-request-id:
          $ref: '#/components/headers/XRequestIdOut'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error:
              code: DEVICE_NOT_FOUND
              message: Thiết bị chưa đăng ký
              details: { deviceId: 0d5c7f33-9d59-4d2e-8f11-0b3c9c0bd511 }

    Err409:
      description: |
        Bốn mã dùng chung mã HTTP này:

        | code | Khi nào | `details` |
        |---|---|---|
        | `REQUEST_ID_CONFLICT` | `requestId` đã tồn tại nhưng payload **khác** | `{receiptId}` — bản đã lưu; client dùng `requestId` mới hoặc bỏ |
        | `RECEIPT_STATE_INVALID` `P4` | Thao tác không hợp lệ với trạng thái hiện tại (`retry-post`, `cancel`, `correct`) | `{current, allowed: [...]}` |
        | `SAP_NOT_CONFIGURED` `P4` | Gọi `retry-post` khi `SAP_ADAPTER=none` | `{adapter: "none"}` |
        | `DUPLICATE_LABEL` `P4` | Trùng nhãn cùng ngày **địa phương** + kho, chưa xác nhận | `{existingReceiptId, existingCreatedAt, existingDeviceId, existingStatus, key}` |

        **Luồng xác nhận 2 bước của `DUPLICATE_LABEL`** (FE làm đúng như sau):
        gửi `POST /api/receipts` bình thường → nhận 409 → **giữ nguyên form, giữ nguyên `requestId`**
        → hiện banner với 2 nút "Xem phiếu đã nhập" và "Vẫn lưu phiếu này" → bấm nút thứ hai thì gửi
        lại **cùng `requestId`, cùng `data`**, chỉ thêm `"allowDuplicate": true` → BE lưu và ghi thêm
        sự kiện `receipt.duplicate_override`.

        Cả bốn mã đều rơi vào loại `CLIENT` của `lib/transport.js` (theo HTTP status 409), tức
        **không retry** và **không khoá nút lưu** — đúng hành vi cần. FE bắt chúng theo `err.code`
        trực tiếp, **không** dựa vào `err.kind`.
      headers:
        x-request-id:
          $ref: '#/components/headers/XRequestIdOut'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            requestIdConflict:
              summary: REQUEST_ID_CONFLICT
              value:
                error:
                  code: REQUEST_ID_CONFLICT
                  message: requestId đã được dùng cho một bản ghi khác
                  details: { receiptId: c2e51dbb-1b93-4f2e-8d2a-5a1a3f4e9c77 }
            duplicateLabel:
              summary: DUPLICATE_LABEL (Phase 4)
              value:
                error:
                  code: DUPLICATE_LABEL
                  message: Nhãn này đã được nhập hôm nay
                  details:
                    existingReceiptId: c2e51dbb-1b93-4f2e-8d2a-5a1a3f4e9c77
                    existingCreatedAt: '2026-09-21T14:10:00.321Z'
                    existingDeviceId: 0d5c7f33-9d59-4d2e-8f11-0b3c9c0bd511
                    existingStatus: posted
                    key:
                      partNumber: BEX32181030AB
                      batch: null
                      saNumber: null
                      warehouse: Kho Long Biên
                      day: '2026-09-21'
            receiptStateInvalid:
              summary: RECEIPT_STATE_INVALID (Phase 4)
              value:
                error:
                  code: RECEIPT_STATE_INVALID
                  message: Không thực hiện được thao tác này với trạng thái hiện tại của phiếu
                  details: { current: posted, allowed: [post_failed] }
            sapNotConfigured:
              summary: SAP_NOT_CONFIGURED (Phase 4)
              value:
                error:
                  code: SAP_NOT_CONFIGURED
                  message: Chưa cấu hình kết nối SAP
                  details: { adapter: none }

    Err413:
      description: Body hoặc ảnh vượt giới hạn. `PAYLOAD_TOO_LARGE` (JSON 1048576 byte) hoặc `IMAGE_TOO_LARGE` (`MAX_UPLOAD_BYTES`, mặc định 10485760 byte).
      headers:
        x-request-id:
          $ref: '#/components/headers/XRequestIdOut'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error:
              code: IMAGE_TOO_LARGE
              message: Ảnh 12582912 byte vượt giới hạn 10485760 byte

    Err415:
      description: Sai Content-Type (`UNSUPPORTED_MEDIA_TYPE`) hoặc ảnh không phải JPEG/PNG/WebP theo magic bytes (`UNSUPPORTED_IMAGE`).
      headers:
        x-request-id:
          $ref: '#/components/headers/XRequestIdOut'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error:
              code: UNSUPPORTED_IMAGE
              message: Chỉ nhận ảnh JPEG, PNG hoặc WebP

    Err422:
      description: |
        Dữ liệu nghiệp vụ bị từ chối.

        | code | `details` |
        |---|---|
        | `VALIDATION_FAILED` | `details.fields[key]` — thông điệp **từng trường**, FE gắn vào đúng ô, **không** hiện banner chung |
        | `RECOGNITION_NOT_FOUND` | — |
        | `LOCATION_UNKNOWN` `P4` | `{field: "location", value, suggestions: [≤ 3 mã]}` — **số ít** `field`, không phải `fields` |

        `LOCATION_UNKNOWN` dùng **422** chứ không 400 vì nó là lỗi **giá trị dữ liệu**, không phải
        lỗi cú pháp. `suggestions` chọn tất định: lọc các `code` `active` **bắt đầu bằng** ký tự đầu
        của `value` (không phân biệt hoa thường), sắp xếp tăng dần, lấy 3 đầu; không khớp ký tự đầu
        nào → mảng rỗng `[]` (**không** vắng key). Kiểm **sau khi** `validateReceiptData` đã chuẩn
        hoá `location`, và chỉ khi `RULE_LOCATION=true` **và** danh mục đã nạp được **và** không rỗng.
      headers:
        x-request-id:
          $ref: '#/components/headers/XRequestIdOut'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            validationFailed:
              summary: VALIDATION_FAILED
              value:
                error:
                  code: VALIDATION_FAILED
                  message: Dữ liệu chưa hợp lệ
                  details:
                    fields:
                      shipmentDate: Ngày không hợp lệ
                      location: Chưa có dữ liệu
            locationUnknown:
              summary: LOCATION_UNKNOWN (Phase 4)
              value:
                error:
                  code: LOCATION_UNKNOWN
                  message: Vị trí không có trong danh mục kho
                  details:
                    field: location
                    value: A-99-99
                    suggestions: [A-09-09, A-03-02, A-01-11]

    Err429:
      description: Hàng đợi nhận dạng đầy (3 chạy + 10 chờ) hoặc chờ quá 30000 ms. `details` **không có** `recognitionId` — chưa recognition nào được tạo.
      headers:
        x-request-id:
          $ref: '#/components/headers/XRequestIdOut'
        retry-after:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error:
              code: RECOGNITION_BUSY
              message: Máy chủ đang xử lý nhiều ảnh, hãy thử lại sau ít giây
              details: { retryAfterMs: 3000, inflight: 3, waiting: 10 }

    Err502:
      description: Provider OCR hỏng (AI server 5xx/429, JSON hỏng, kết nối hỏng) sau khi đã hết lượt retry.
      headers:
        x-request-id:
          $ref: '#/components/headers/XRequestIdOut'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error:
              code: RECOGNITION_FAILED
              message: AI server trả HTTP 502 — UPSTREAM_ERROR LLM API trả HTTP 500
              details:
                recognitionId: 218e4142-7a3b-4c11-9f0e-1b2c3d4e5f60
                imageId: 4944ec07-2d66-4c5a-9e81-0b7c3a5d9e12

    Err503:
      description: |
        Máy chủ tạm không phục vụ được. `PROVIDER_NOT_CONFIGURED` (thiếu `AI_SERVER_URL` hoặc
        ai-server thiếu key) · `SAVE_FAILED_SIMULATED` · `BACKEND_DOWN_SIMULATED` ·
        `BACKEND_READONLY`. Ba mã mô phỏng kèm `retry-after: 5` và `details.retryAfterMs: 5000`.
      headers:
        x-request-id:
          $ref: '#/components/headers/XRequestIdOut'
        retry-after:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error:
              code: BACKEND_DOWN_SIMULATED
              message: 'Mô phỏng: máy chủ đang ngừng hoạt động'
              details: { retryAfterMs: 5000, simulated: true }

    Err504:
      description: |
        Quá ngân sách `RECOGNITION_TIMEOUT_MS` (Phase 3: 20000 ms, dùng chung cho cả 2 attempt),
        **hoặc** ai-server trả HTTP 504 / `error.code = "UPSTREAM_TIMEOUT"`.
      headers:
        x-request-id:
          $ref: '#/components/headers/XRequestIdOut'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error:
              code: RECOGNITION_TIMEOUT
              message: Nhận dạng quá 20000 ms không phản hồi
              details:
                recognitionId: 218e4142-7a3b-4c11-9f0e-1b2c3d4e5f60
                imageId: 4944ec07-2d66-4c5a-9e81-0b7c3a5d9e12
