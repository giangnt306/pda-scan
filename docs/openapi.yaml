                supplier: Nội bộ — Made in Vietnam
                location: A-03-02
                batch: null
                saNumber: null
                variant: null
                plantDock: null
                grossWeight: 12.5
                packaging: null
                note: null
              fieldMeta: {}
              reason: Đếm lại còn 78
      responses:
        '201':
          description: Phiếu **mới** thay thế phiếu cũ
