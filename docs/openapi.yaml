  /api/receipts/{receiptId}/correct:
    post:
      operationId: correctReceipt
      tags: [receipts]
      summary: Sửa một phiếu bằng cách tạo phiếu mới thay thế
      description: |
        Sửa **không bao giờ ghi đè**: tạo một phiếu **mới** với `supersedesReceiptId = <id cũ>` ở
        trạng thái `corrected`; phiếu cũ chuyển `superseded` và đóng băng. Kho cần biết đã từng
        nhập sai cái gì.

        **Sửa được từ:** `confirmed`, `posting`, `post_failed`, `rejected`, `corrected`
        (chuỗi `A → B → C` là hợp lệ, mỗi bước một cặp `supersedes`/`supersededBy`).
        **Không sửa được từ:** `posted` (đã có chứng từ SAP → phải `cancel` rồi nhập phiếu mới),
        `cancelled`, `superseded` → `409 RECEIPT_STATE_INVALID`.

        `recognitionId`, `imageId`, `imageUrl`, `source` của phiếu mới **sao chép nguyên** từ phiếu
        cũ: ảnh nhãn không đổi khi người ta sửa số lượng, bắt chụp lại là vô lý. `deviceId` và
        `sessionId` lấy từ **header của request này**, không phải của phiếu cũ.

        `requestId` mới là **bắt buộc và phải khác** `requestId` của phiếu cũ (khoá idempotency —
        hai phiếu khác nhau không được dùng chung); trùng → `409 REQUEST_ID_CONFLICT`.

        **Thao tác sửa BỎ QUA rule trùng nhãn** — phiếu mới gần như chắc chắn trùng nhãn với phiếu
        cũ mà nó thay thế. Rule vị trí (`LOCATION_UNKNOWN`) thì **vẫn áp dụng**.

        Side-effect, tất cả trong **MỘT** transaction SQLite: `INSERT` phiếu mới → `UPDATE` phiếu cũ
        → `DELETE` outbox `kind='post'` của phiếu cũ → `INSERT` outbox cho phiếu mới (nếu
        `SAP_ADAPTER != 'none'`) → ghi **hai** dòng `receipt_events` (`receipt.corrected` cho phiếu
        mới, `receipt.superseded` cho phiếu cũ).

        Ảnh của phiếu `superseded` **không** bị xoá; phiếu cũ và phiếu mới dùng chung `imageId`.
