  /api/receipts/{receiptId}/cancel:
    post:
      operationId: cancelReceipt
      tags: [receipts]
      summary: Huỷ một phiếu
      description: |
        **Huỷ được từ:** `confirmed`, `posting`, `posted`, `post_failed`, `rejected`, `corrected`.
        **Không huỷ được từ:** `cancelled` (đã huỷ), `superseded` (đóng băng) → `409
        RECEIPT_STATE_INVALID` với `details = {current, allowed: [...]}`.

        Side-effect, trong **một** transaction:

        1. `DELETE` dòng `outbox` `kind='post'` của phiếu nếu còn (huỷ thì đừng gửi nữa).
        2. `receipts.status = 'cancelled'`, `receipts.cancel_reason = <reason>`.
        3. Ghi `receipt_events (receipt.cancelled, actor.kind = "operator")`.
        4. Nếu trước đó là `posted` **và** `SAP_ADAPTER=mock`: tạo `outbox` mới `kind='reversal'`
           và ghi `receipt.reversal_queued`.

        `sapDocumentNo` **không bị xoá** khi huỷ — chứng từ đã tồn tại trong SAP, reversal là một
        chứng từ **khác**. Job reversal chạy xong **không** đổi `status` (vẫn `cancelled`), chỉ ghi
        thêm `receipt.reversal_posted` hoặc `receipt.reversal_failed`.

        Cạnh tranh với worker: nếu người dùng huỷ **trong lúc** SAP đang chạy, lần ghi kết quả của
        worker thấy phiếu đã `cancelled` và **bỏ qua** (log `outbox.stale_result`). Hệ quả quan sát
        được: SAP mock đã nhận phiếu nhưng phiếu ở `cancelled` không có `sapDocumentNo` — hành vi
        **đúng và có chủ ý** cho một hệ mô phỏng.

        **Không idempotent** (khác với `retry-post`): huỷ hai lần là hai lần huỷ, lần hai trả 409.
      x-status: phase-4
      x-phase: 4
      parameters:
        - $ref: '#/components/parameters/ReceiptIdPath'
        - $ref: '#/components/parameters/XDeviceId'
        - $ref: '#/components/parameters/XSessionId'
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  minLength: 1
                  maxLength: 200
                  description: 'Sau `trim` dài 1..200 ký tự. Thiếu/rỗng/quá dài → `400 INVALID_BODY` với `details.field = "reason"`.'
            example: { reason: Nhập nhầm pallet }
