  # ─────────────────────────────── PHASE 3 — trạng thái ───────────────────────────────

  /api/status:
    get:
      operationId: getStatus
      tags: [status]
      summary: Trạng thái hệ thống cho PDA (poll 10000 ms)
      description: |
        **Đường sống duy nhất** để PDA biết chuyện gì đang xảy ra. Endpoint này được **miễn trừ**
        khỏi mô phỏng `backend.mode = down` và `readonly`, nhưng **vẫn chịu** `latencyMs` khi
        `degraded` — vì "chậm" là một tình trạng cần quan sát được, và FE có timeout riêng 5000 ms
        cho status poll.

        **Không** cập nhật `devices.last_seen` (ngoại lệ duy nhất trong toàn API): poll status là
        *đọc trạng thái*, không phải *dấu hiệu sống*.

        `ocr` là kết quả probe `GET /health` của ai-server, có cache TTL **10000 ms**. Hệ quả kiểm
        chứng được: tắt ai-server → chậm nhất 10 giây sau `ocr.reachable` thành `false`.

        **`sap` — Phase 4 ĐẢO NGƯỢC quy tắc của Phase 3.** Ở Phase 3, `sap` **luôn** là
        `{"reachable": false, "mode": "not_configured"}` và `sim.sap.mode` **không rò rỉ** vào đây.
        Từ Phase 4 điều đó đổi **có chủ ý**: adapter SAP đã tồn tại và mock **chính là** adapter
        đang chạy, nên `status.sap.mode` phản ánh đúng chế độ của adapter. Công thức:

        ```
        reachable = (SAP_ADAPTER !== "none") && (sim.effective.sap.mode !== "down")
        mode      = (SAP_ADAPTER === "none") ? "not_configured" : sim.effective.sap.mode
        ```

        | `SAP_ADAPTER` | `sim.effective.sap.mode` | `status.sap` |
        |---|---|---|
        | `none` | bất kỳ | `{reachable: false, mode: "not_configured"}` |
        | `mock` | `success` | `{reachable: true, mode: "success"}` |
        | `mock` | `slow` | `{reachable: true, mode: "slow"}` |
        | `mock` | `reject` | `{reachable: true, mode: "reject"}` |
        | `mock` | `down` | `{reachable: false, mode: "down"}` |

        Vẫn **đúng 2 key**, không thêm key nào. Khi `SIM_OVERRIDE=false`, `sim.effective` là mặc
        định → `mode = "success"`, `reachable = true` (với adapter `mock`).

        **`queue.outboxPending`** từ Phase 4 là `SELECT COUNT(*) FROM outbox WHERE state = 'pending'`
        — đếm **cả** `kind='post'` lẫn `kind='reversal'`; `state='failed'` **không** tính (đã bỏ
        cuộc, chờ người bấm "Gửi lại"). `SAP_ADAPTER=none` hoặc bảng rỗng → `0`.

        Hai mục trên thuộc **hợp đồng Phase 4** — xem khối "Trạng thái triển khai" ở
        `info.description`. `shape` của response **không đổi** ở Phase 4, chỉ đổi **giá trị**.

        **Phase 5 MỞ RỘNG shape** — đây là lần đầu `/api/status` thêm key, và nó **chỉ thêm**:

        - `queue` từ 3 key thành **5 key**: thêm `recognitionsPending` và
          `recognitionsFailedRecent`, cả hai đếm trong **bảng `recognitions`** chứ không trong
          semaphore, nên chúng vẫn đúng khi `RECOGNITION_MODE=async` và công việc chạy nền sau
          khi PDA đã đóng tab.
        - thêm khoá cấp một `recognition` (**5 key**, đọc thẳng từ config) ngay sau `queue`.
          FE dùng `recognition.mode` để **tự biết** đi đường `sync` hay `async`, không hard-code.

        Client Phase 3–4 bỏ qua key lạ nên vẫn chạy được; client Phase 5 thì **không** được coi
        hai khối này là tuỳ chọn — chúng luôn có mặt.
      x-status: phase-3
      parameters:
        - $ref: '#/components/parameters/XDeviceId'
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Trạng thái đầy đủ — mọi key luôn có mặt
          headers:
            x-request-id:
              $ref: '#/components/headers/XRequestIdOut'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusResponse' }
              example:
                backend: { state: up, readonly: false, latencyMs: 0, uptimeSec: 3612, simulated: false }
                ocr:
                  reachable: true
                  configured: true
                  ready: true
                  simMode: null
                  mode: success
                  model: gpt-4o-mini
                  provider: http
                  checkedAt: '2026-09-21T14:05:18.400Z'
                  latencyMs: 37
                  cached: true
                sap: { reachable: true, mode: success }
                queue:
                  recognitionsInflight: 1
                  recognitionsWaiting: 0
                  outboxPending: 2
                  recognitionsPending: 1
                  recognitionsFailedRecent: 0
                recognition: { mode: async, maxConcurrent: 3, maxWaiting: 10, timeoutMs: 20000, pollHintMs: 1000 }
                sim:
                  enabled: true
                  scope: global
                  effective:
                    backend: { mode: normal, latencyMs: 0 }
                    ocr: { mode: success, delayMs: 0 }
                    save: { mode: normal, latencyMs: 0 }
